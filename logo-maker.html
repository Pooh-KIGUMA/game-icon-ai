<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="AIロゴメーカー。会社名、チーム名、クラン名、色、雰囲気を入力するだけでオリジナルロゴをAIで作成。">
<title>AIロゴメーカー — Iconia AI</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--panel:#11151f;--line:#2b3244;--text:#f7f8fc;--muted:#929bb0;--a:#7657ff;--c:#16c8ff;--good:#62e2be;--bad:#ff8792}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 50% -260px,#302064 0,#07080d 67%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:#08090eea;backdrop-filter:blur(20px);border-bottom:1px solid #ffffff0b}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.mark{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--c));font-size:24px;box-shadow:0 10px 35px #3d52c655}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.topActions{display:flex;align-items:center;gap:7px}.topBtn{color:#fff;text-decoration:none;background:#171b26;border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:12px;font-weight:750;white-space:nowrap}.balance{display:flex;align-items:center;gap:6px;background:#151a25;border:1px solid #343c50;border-radius:12px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap}.balance b{font-size:15px;color:#69e8c4}.balance.zero b{color:#ff8792}.balance.loading b{color:#929bb0}.wrap{max-width:1050px;margin:auto;padding:30px 14px 110px}.hero{text-align:center;padding:18px 10px 28px}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 12px;letter-spacing:-1px}.hero h1 span{background:linear-gradient(90deg,#fff,#9edcff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:0 auto;color:#aab2c5;line-height:1.8;max-width:680px}.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:17px}.step{font-size:10px;color:#a8b0c1;background:#111621;border:1px solid #262d3e;padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:420px 1fr;gap:18px;align-items:start}.card{background:#10141d;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 70px #0005;padding:20px}.card h2{font-size:17px;margin:0 0 18px}.field{margin-bottom:15px}.field label{display:block;color:#b9c0cf;font-size:11px;font-weight:750;margin:0 0 7px}.field input,.field textarea{width:100%;border:1px solid #30374a;background:#171b26;color:#fff;border-radius:13px;outline:0;padding:12px 13px}.field input:focus,.field textarea:focus{border-color:#7666ff;box-shadow:0 0 0 3px #7657ff18}.field textarea{min-height:76px;resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#171b26;border:1px solid #30374a;padding:8px 10px;border-radius:999px;color:#cbd1df;font-size:11px}.choice.active{background:#292052;border-color:#7561ff;color:#fff}.colorRow{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:35px;height:35px;border-radius:50%;border:2px solid #353b4c;background:var(--sw);padding:0}.swatch.active{outline:2px solid #fff;outline-offset:2px}.custom{display:flex;align-items:center;gap:8px;background:#171b26;border:1px solid #30374a;border-radius:12px;padding:4px 9px}.custom input{width:34px;height:30px;padding:0;border:0;background:transparent}.generate{width:100%;padding:14px 16px;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--c));font-weight:850;box-shadow:0 10px 35px #3d52c655}.generate:disabled{opacity:.45;box-shadow:none}.note{font-size:10px;color:#747d91;text-align:center;line-height:1.6;margin-top:10px}.resultBox{min-height:530px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.empty{text-align:center;color:#70798d;padding:40px}.empty .big{font-size:64px;margin-bottom:10px}.empty b{display:block;color:#d8dce6;font-size:16px;margin-bottom:7px}.result{width:min(100%,520px);border-radius:20px;display:block;box-shadow:0 20px 70px #0009;background:#fff}.resultActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.resultActions button{background:#222837;border:1px solid #343c50;padding:9px 13px;border-radius:11px;font-size:11px}.status{position:absolute;inset:auto 18px 18px 18px;background:#111722ee;border:1px solid var(--line);border-radius:14px;padding:12px;color:#cbd2df;font-size:11px;text-align:center;backdrop-filter:blur(10px)}.status.error{color:#ffb9c0;border-color:#6d3038}.status.ok{color:#b9ffe8;border-color:#286a5b}.back{display:inline-block;margin-top:18px;color:#8d9aff;text-decoration:none;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.resultBox{min-height:420px}.wrap{padding-top:18px}.hero{padding-bottom:20px}}@media(max-width:600px){.top{min-height:62px;padding:7px 11px}.brand b{font-size:16px}.brand small{font-size:9px}.mark{width:41px;height:41px}.topActions{gap:4px}.topBtn{padding:8px 8px;font-size:10px}.balance{padding:7px 8px;font-size:9px;gap:3px}.balance b{font-size:13px}.card{padding:15px;border-radius:20px}.resultBox{min-height:340px}.hero h1{font-size:32px}.hero p{font-size:13px}.wrap{padding-left:10px;padding-right:10px}}@media(max-width:390px){.brand small{display:none}.topBtn{font-size:9px;padding:7px}.balance{padding:6px 7px}}
</style>
</head>
<body>
<header class="top">
<a href="/" class="brand"><div class="mark">✦</div><div><b>Iconia AI</b><small>AI Creative Studio</small></div></a>
<div class="topActions"><div id="balance" class="balance loading">🪙 残高 <b>—</b></div><a class="topBtn" href="/pricing.html">クレジット購入</a></div>
</header>
<main class="wrap">
<section class="hero"><h1><span>AIロゴメーカー</span></h1><p>会社・ブランド・チーム・クラン・ゲーム用ロゴを、あなたのイメージからAIでデザイン。名前と雰囲気を入力するだけで、オリジナルのロゴ案を作れます。</p><div class="steps"><span class="step">① 名前を入力</span><span class="step">② デザインを選択</span><span class="step">③ AIが作成</span></div></section>
<section class="grid">
<div class="card">
<h2>ロゴの内容</h2>
<div class="field"><label>ブランド・チーム・クラン名 *</label><input id="name" maxlength="40" placeholder="例：AxLF"></div>
<div class="field"><label>用途</label><div class="choices" id="uses"><button class="choice active" data-v="ゲーム・クラン">🎮 ゲーム・クラン</button><button class="choice" data-v="チーム">🏆 チーム</button><button class="choice" data-v="ブランド">💎 ブランド</button><button class="choice" data-v="YouTube・SNS">📱 YouTube・SNS</button><button class="choice" data-v="会社・店舗">🏢 会社・店舗</button></div></div>
<div class="field"><label>ロゴの雰囲気</label><div class="choices" id="styles"><button class="choice active" data-v="高級感・スタイリッシュ">✨ 高級・スタイリッシュ</button><button class="choice" data-v="クール・攻撃的">⚡ クール・攻撃的</button><button class="choice" data-v="シンプル・ミニマル">◼ シンプル</button><button class="choice" data-v="可愛い・ポップ">🌈 可愛い・ポップ</button><button class="choice" data-v="近未来・サイバー">🌌 サイバー</button><button class="choice" data-v="和風・伝統的">⛩ 和風</button></div></div>
<div class="field"><label>メインカラー</label><div class="colorRow" id="colors"><button class="swatch active" style="--sw:#4f6cff" data-v="青"></button><button class="swatch" style="--sw:#8a4dff" data-v="紫"></button><button class="swatch" style="--sw:#ff3f67" data-v="赤・ピンク"></button><button class="swatch" style="--sw:#ffd447" data-v="金・黄色"></button><button class="swatch" style="--sw:#21d89b" data-v="緑"></button><button class="swatch" style="--sw:#f4f5f7" data-v="白・シルバー"></button><button class="swatch" style="--sw:#171717" data-v="黒"></button><div class="custom"><span style="font-size:10px;color:#aeb5c5">自由色</span><input id="customColor" type="color" value="#4f6cff"></div></div></div>
<div class="field"><label>入れたいモチーフ・シンボル</label><input id="symbol" maxlength="80" placeholder="例：狼、炎、王冠、稲妻、盾、頭文字A"></div>
<div class="field"><label>追加の希望（任意）</label><textarea id="details" maxlength="500" placeholder="例：文字を読みやすく。丸いエンブレム。青い光を少し入れて、ゲームのクランロゴらしく。"></textarea></div>
<button class="generate" id="generate">✦ AIでロゴを作成する</button><div class="note">作成には1クレジットを使用します。生成に失敗した場合は自動的に返還されます。</div>
</div>
<div class="card resultBox" id="resultBox"><div class="empty" id="empty"><div class="big">✦</div><b>ここにAIロゴが表示されます</b><span>左側で名前とデザインを指定してください</span></div></div>
</section>
<a class="back" href="/">← Iconia AI ゲームアイコンへ戻る</a>
</main>
<script>
const $=id=>document.getElementById(id);let use='ゲーム・クラン',style='高級感・スタイリッシュ',color='青',lastImage='';
let currentCredits=null;
function chips(id,fn){document.querySelectorAll('#'+id+' .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');fn(b.dataset.v)})}
chips('uses',v=>use=v);chips('styles',v=>style=v);
document.querySelectorAll('#colors .swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('#colors .swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.v});
$('customColor').oninput=e=>{document.querySelectorAll('#colors .swatch').forEach(x=>x.classList.remove('active'));color='カスタムカラー '+e.target.value};
function showStatus(text,kind=''){const box=$('resultBox');let s=document.querySelector('.status');if(!s){s=document.createElement('div');s.className='status';box.appendChild(s)}s.className='status '+kind;s.textContent=text}
function setBalance(n){const el=$('balance');currentCredits=Number(n);el.classList.remove('loading','zero');if(currentCredits<=0)el.classList.add('zero');el.innerHTML=`🪙 残高 <b>${currentCredits}</b>`;el.title=`現在 ${currentCredits} クレジット`;const btn=$('generate');if(btn&&!btn.disabled){btn.disabled=currentCredits<=0;btn.textContent=currentCredits<=0?'クレジットを購入して作成する':'✦ AIでロゴを作成する'}}
async function refreshCredits(){try{const r=await fetch('/api/credits',{method:'GET',credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error();setBalance(data.credits??0);return Number(data.credits??0)}catch{$('balance').classList.remove('loading');$('balance').innerHTML='🪙 残高 <b>—</b>';return null}}
function findImage(data){return data?.image||data?.image_url||data?.url||data?.result?.image||data?.result?.image_url||data?.result?.url||data?.data?.[0]?.url||(data?.data?.[0]?.b64_json?'data:image/png;base64,'+data.data[0].b64_json:null)}
$('generate').onclick=async()=>{const name=$('name').value.trim();if(!name){$('name').focus();showStatus('まずロゴ名を入力してください','error');return}if(currentCredits!==null&&currentCredits<=0){showStatus('クレジットがありません。上の「クレジット購入」から購入してください。','error');return}const btn=$('generate');btn.disabled=true;btn.textContent='✦ AIがロゴをデザイン中…';$('empty').style.display='none';const old=document.querySelector('.result');if(old)old.remove();const oldActions=document.querySelector('.resultActions');if(oldActions)oldActions.remove();showStatus('ロゴの構成・文字・シンボル・配色を最適化しています…');const prompt=`AIロゴメーカーとして、完成度の高い商用ロゴを1枚作成してください。ブランド名は「${name}」。用途は${use}。雰囲気は${style}。メインカラーは${color}。${$('symbol').value.trim()?'モチーフ：'+$('symbol').value.trim()+'.':''}${$('details').value.trim()?'追加希望：'+$('details').value.trim():''}\n\n重要：ロゴデザインそのものを画像として作成してください。ブランド名「${name}」は正確に一度だけ入れてください。余計な文字、説明文、透かし、サンプルUIは入れないでください。シンボルとワードマークを一体化したプロフェッショナルなロゴにしてください。文字は読みやすく、スマホの小さなアイコンでも判別できる強いシルエットにしてください。背景はロゴが見やすいシンプルな背景。完成したブランドロゴだけを中央に配置し、余白を十分に残してください。ゲームクラン用ならエンブレム感、ブランド用なら洗練されたブランドマーク感を優先してください。`;
try{const r=await fetch('/api/generate-gated',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,mode:'text-logo',format:'icon',source:'logo-maker'})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error||'生成に失敗しました');const image=findImage(data);if(!image)throw new Error('画像データを受け取れませんでした');lastImage=image;const img=document.createElement('img');img.className='result';img.src=image;img.alt=name+' AIロゴ';$('resultBox').prepend(img);showStatus('完成しました。画像を長押しして保存できます。','ok');const actions=document.createElement('div');actions.className='resultActions';actions.innerHTML='<button id="saveBtn">画像を保存</button><button id="newBtn">別デザインを作る</button>';$('resultBox').appendChild(actions);$('saveBtn').onclick=()=>{const a=document.createElement('a');a.href=lastImage;a.download=name+'-logo.png';a.click()};$('newBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});await refreshCredits()}catch(e){$('empty').style.display='block';showStatus(e.message||'生成に失敗しました','error');await refreshCredits()}finally{if(currentCredits===null||currentCredits>0){btn.disabled=false;btn.textContent='✦ AIでロゴを作成する'}}};
refreshCredits();window.addEventListener('pageshow',refreshCredits);window.addEventListener('focus',refreshCredits);
</script>
</body>
</html>
