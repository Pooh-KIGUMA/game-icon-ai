<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080d"><title>Iconia AI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="/index.html" title="Iconia AI"></iframe><script>
const frame=document.getElementById('app');
const W={
ja:{h:'自分だけのゲームアイコンを、話すだけで。',p:'標準は1:1のゲームアイコン。会話の流れを理解して、人物の同一性を守りながら必要な部分だけを編集します。文字やロゴは画像の雰囲気に合わせて自動デザインします。',cards:[['🧠 会話を理解','「さっきの画像」「このキャラ」などを文脈から判断。'],['🛡 同一性を最優先','人物・顔・髪・服・ポーズを勝手に別人へ変えない。'],['🎨 自動デザイン','文字を指定するだけでも、画像に合うロゴ風デザインを自動提案。'],['✂ 部分編集','背景・髪・服・文字など、頼まれた場所を中心に編集。'],['📐 1:1が標準','ゲームアイコンを基本に、必要なときだけXやYouTubeへ。'],['💬 普通に会話','「いい感じ」「ありがとう」などは画像を作らず会話します。']]},
en:{h:'Create your perfect gaming icon by simply chatting.',p:'Gaming icons are 1:1 by default. Iconia understands the conversation, preserves character identity, and edits only what you ask for. Text and logos are automatically designed to match the image.',cards:[['🧠 Understands context','Understands phrases like “the previous image” and “this character”.'],['🛡 Identity first','Keeps the face, hair, clothes and pose from changing into a different person.'],['🎨 Auto design','Automatically creates a logo-style design that fits the image.'],['✂ Targeted editing','Focuses edits on the background, hair, clothes, text and other requested areas.'],['📐 1:1 by default','Gaming icons first, with X and YouTube formats when needed.'],['💬 Natural conversation','Replies normally to “Looks good” or “Thanks” without generating an image.']]},
ko:{h:'대화만으로 나만의 게임 아이콘을 만들어 보세요.',p:'기본 출력은 1:1 게임 아이콘입니다. 대화의 맥락을 이해하고 캐릭터의 동일성을 유지하면서 요청한 부분만 편집합니다. 텍스트와 로고는 이미지 분위기에 맞게 자동 디자인합니다.',cards:[['🧠 대화 이해','“이전 이미지”, “이 캐릭터” 같은 표현을 문맥으로 이해합니다.'],['🛡 동일성 우선','얼굴, 머리, 의상, 포즈가 다른 인물로 바뀌지 않게 합니다.'],['🎨 자동 디자인','이미지에 어울리는 로고 스타일을 자동으로 디자인합니다.'],['✂ 부분 편집','배경, 머리, 의상, 텍스트 등 요청한 부분을 중심으로 편집합니다.'],['📐 1:1 기본','게임 아이콘을 기본으로 필요할 때 X와 YouTube 형식을 사용합니다.'],['💬 자연스러운 대화','“좋아”, “고마워” 같은 말에는 이미지를 만들지 않고 대화합니다.']]},
'zh-CN':{h:'只需聊天，就能制作专属游戏头像。',p:'默认输出为1:1游戏头像。Iconia会理解对话上下文，在保持人物一致性的同时，只修改你要求的部分。文字和Logo会自动匹配图片风格。',cards:[['🧠 理解对话','理解“上一张图片”“这个角色”等上下文表达。'],['🛡 优先保持人物一致','避免脸部、头发、服装和姿势变成另一个人。'],['🎨 自动设计','自动制作与图片氛围匹配的Logo风格设计。'],['✂ 局部编辑','重点编辑你指定的背景、头发、服装、文字等部分。'],['📐 默认1:1','以游戏头像为主，需要时可使用X和YouTube尺寸。'],['💬 自然对话','收到“很好”“谢谢”等内容时正常聊天，不生成图片。']]},
'zh-TW':{h:'只要聊天，就能製作專屬遊戲頭像。',p:'預設輸出為1:1遊戲頭像。Iconia會理解對話脈絡，在保持人物一致性的同時，只修改你要求的部分。文字和Logo會自動配合圖片風格。',cards:[['🧠 理解對話','理解「上一張圖片」「這個角色」等脈絡表達。'],['🛡 優先保持人物一致','避免臉部、頭髮、服裝與姿勢變成另一個人。'],['🎨 自動設計','自動製作符合圖片氛圍的Logo風格設計。'],['✂ 局部編輯','重點編輯你指定的背景、頭髮、服裝、文字等部分。'],['📐 預設1:1','以遊戲頭像為主，需要時可使用X與YouTube尺寸。'],['💬 自然對話','收到「很好」「謝謝」等內容時正常聊天，不生成圖片。']]}
};
function syncWelcome(){try{const w=frame.contentWindow,d=frame.contentDocument,t=w.iconiaLocale?w.iconiaLocale():'ja',x=W[t]||W.ja;const h=d.querySelector('.welcome h1'),p=d.querySelector('.welcome p'),cards=d.querySelectorAll('.card');if(h)h.textContent=x.h;if(p)p.textContent=x.p;cards.forEach((c,i)=>{if(x.cards[i]){const b=c.querySelector('b'),s=c.querySelector('span');if(b)b.textContent=x.cards[i][0];if(s)s.textContent=x.cards[i][1]}});d.documentElement.lang=t}catch(e){}}
frame.addEventListener('load',()=>{const d=frame.contentDocument,s=d.createElement('script');s.src='/i18n.js?v=global';s.onload=()=>{syncWelcome();const obs=new MutationObserver(syncWelcome);const main=d.getElementById('main');if(main)obs.observe(main,{childList:true,subtree:true,characterData:true});};d.head.appendChild(s)});
</script></body></html>
