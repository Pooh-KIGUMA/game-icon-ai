<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080d"><title>Iconia AI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d}iframe{display:block;width:100%;height:100%;border:0}#globalLang{position:fixed;right:12px;top:12px;z-index:9999;background:#151822;color:#f6f7fb;border:1px solid #34394b;border-radius:12px;padding:9px 11px;font:700 12px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 8px 28px #0008}</style></head><body><select id="globalLang" aria-label="Language"><option value="ja">🇯🇵 日本語</option><option value="en">🇺🇸 English</option><option value="ko">🇰🇷 한국어</option><option value="zh-CN">🇨🇳 简体中文</option><option value="zh-TW">🇹🇼 繁體中文</option></select><iframe id="app" src="/index.html" title="Iconia AI"></iframe><script>
const frame=document.getElementById('app'),lang=document.getElementById('globalLang');
const W={ja:{h:'自分だけのゲームアイコンを、話すだけで。',p:'標準は1:1のゲームアイコン。会話の流れを理解して、人物の同一性を守りながら必要な部分だけを編集します。文字やロゴは画像の雰囲気に合わせて自動デザインします.'},en:{h:'Create your perfect gaming icon by simply chatting.',p:'Gaming icons are 1:1 by default. Iconia understands the conversation, preserves character identity, and edits only what you ask for.'},ko:{h:'대화만으로 나만의 게임 아이콘을 만들어 보세요.',p:'기본 출력은 1:1 게임 아이콘입니다. 대화의 맥락을 이해하고 캐릭터의 동일성을 유지하면서 요청한 부분만 편집합니다.'},'zh-CN':{h:'只需聊天，就能制作专属游戏头像。',p:'默认输出为1:1游戏头像。Iconia会理解对话上下文，在保持人物一致性的同时，只修改你要求的部分。'},'zh-TW':{h:'只要聊天，就能製作專屬遊戲頭像。',p:'預設輸出為1:1遊戲頭像。Iconia會理解對話脈絡，在保持人物一致性的同時，只修改你要求的部分。'}};
function syncWelcome(){try{const d=frame.contentDocument,t=frame.contentWindow.iconiaLocale?frame.contentWindow.iconiaLocale():'ja',x=W[t]||W.ja;const h=d.querySelector('.welcome h1'),p=d.querySelector('.welcome p');if(h)h.textContent=x.h;if(p)p.textContent=x.p;d.documentElement.lang=t;lang.value=t}catch(e){}}
function setLocale(t){try{localStorage.setItem('iconia_locale',t)}catch(e){};lang.value=t;try{if(typeof frame.contentWindow.setIconiaLocale==='function'){frame.contentWindow.setIconiaLocale(t);syncWelcome();return}}catch(e){}try{frame.contentWindow.postMessage({type:'iconia-set-locale',locale:t},'*')}catch(e){}}
lang.addEventListener('change',()=>setLocale(lang.value));
frame.addEventListener('load',()=>{const d=frame.contentDocument,s=d.createElement('script');s.src='/i18n.js?v=instant4';s.onload=()=>{const e=d.createElement('script');e.src='/locale-enhancements.js?v=1';d.head.appendChild(e);const c=d.createElement('script');c.src='/credit-guard.js?v=3';d.head.appendChild(c);syncWelcome();setTimeout(syncWelcome,50);};d.head.appendChild(s)});
setInterval(syncWelcome,500);
</script></body></html>
