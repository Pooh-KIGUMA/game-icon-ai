<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Iconia AI</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="/index.html" title="Iconia AI"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const s=d.createElement('script');
  s.src='/i18n.js?v=instant5';
  s.onload=()=>{
    const e=d.createElement('script');
    e.src='/locale-enhancements.js?v=2';
    e.onload=()=>{
      const c=d.createElement('script');
      c.src='/credit-guard.js?v=7';
      c.onload=()=>{
        const f=d.createElement('script');
        f.src='/mobile-fix.js?v=2';
        d.head.appendChild(f);
      };
      d.head.appendChild(c);
    };
    d.head.appendChild(e);
  };
  d.head.appendChild(s);
});
</script>
</body>
</html>
