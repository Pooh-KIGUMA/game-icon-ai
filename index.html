<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME ICON AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --bg:#08090c;
  --card:#111318;
  --card2:#151820;
  --line:#292d36;
  --text:#f7f7f8;
  --muted:#9297a3;
  --gold:#d8b45a;
  --gold2:#f1d487;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(216,180,90,.16),transparent 35%),
    #08090c;
  color:var(--text);
  font-family:Inter,"Noto Sans JP",sans-serif;
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(18px);
  background:rgba(8,9,12,.82);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1000px;
  margin:auto;
  height:72px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:var(--gold);
}

.lang{
  background:#111318;
  color:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  outline:none;
}

.container{
  width:min(900px,calc(100% - 28px));
  margin:auto;
  padding:45px 0 80px;
}

.hero{
  text-align:center;
  margin-bottom:40px;
}

.badge{
  display:inline-flex;
  padding:7px 12px;
  border:1px solid rgba(216,180,90,.35);
  background:rgba(216,180,90,.08);
  color:var(--gold2);
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
}

h1{
  font-size:clamp(38px,8vw,72px);
  margin:18px 0 10px;
  line-height:1;
  letter-spacing:-3px;
}

.hero p{
  color:var(--muted);
  margin:0;
  font-size:15px;
}

.card{
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.number{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--gold);
  color:#111;
  font-size:13px;
  font-weight:900;
}

.step h2{
  margin:0;
  font-size:17px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{
  cursor:pointer;
  border:1px solid var(--line);
  background:#0d0f13;
  color:#fff;
  border-radius:15px;
  padding:18px;
  text-align:left;
  transition:.2s;
}

.option:hover{
  border-color:#555b68;
  transform:translateY(-1px);
}

.option.active{
  border-color:var(--gold);
  background:rgba(216,180,90,.08);
  box-shadow:0 0 0 1px rgba(216,180,90,.2);
}

.option strong{
  display:block;
  font-size:15px;
  margin-bottom:5px;
}

.option small{
  color:var(--muted);
  font-size:12px;
}

.upload{
  border:1px dashed #414650;
  border-radius:18px;
  min-height:190px;
  display:grid;
  place-items:center;
  text-align:center;
  cursor:pointer;
  background:#0d0f13;
  transition:.2s;
}

.upload:hover{
  border-color:var(--gold);
}

.upload-icon{
  font-size:42px;
  margin-bottom:8px;
}

.upload strong{
  display:block;
}

.upload small{
  color:var(--muted);
}

.preview{
  display:none;
  margin-top:14px;
  position:relative;
}

.preview img{
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:15px;
  background:#050608;
}

.remove{
  position:absolute;
  top:10px;
  right:10px;
  border:0;
  background:#000b;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  background:#0b0d11;
  border:1px solid var(--line);
  border-radius:15px;
  color:#fff;
  padding:16px;
  outline:none;
}

textarea:focus{
  border-color:var(--gold);
}

.styles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.style{
  border:1px solid var(--line);
  background:#0c0e12;
  color:#fff;
  border-radius:13px;
  padding:13px 8px;
  cursor:pointer;
}

.style.active{
  border-color:var(--gold);
  background:rgba(216,180,90,.08);
}

.generate{
  width:100%;
  border:0;
  border-radius:16px;
  padding:18px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#111;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(216,180,90,.18);
}

.generate:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:20px;
}

.result{
  display:none;
}

.result img{
  width:100%;
  border-radius:18px;
  display:block;
}

.download{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:14px;
  padding:14px;
  border-radius:13
