<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>Iconia AI</title>

<style>
:root{
  --bg:#08090f;
  --panel:#11131d;
  --panel2:#171a26;
  --line:#292d3d;
  --text:#f7f8ff;
  --muted:#9ca2b7;
  --a:#7958ff;
  --b:#25c9ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
}

body{
  min-height:100vh;
}

button,textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

.app{
  max-width:820px;
  margin:auto;
  min-height:100vh;
  padding-bottom:150px;
}

header{
  position:sticky;
  top:0;
  z-index:30;
  padding:10px 13px calc(9px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#08090fe8;
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--a),var(--b));
  font-size:22px;
}

.brand strong{
  font-size:19px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.topbtn{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:9px 12px;
  font-weight:800;
}

main{
  padding:17px 13px;
}

.hero{
  padding:6px 3px 18px;
}

.hero h1{
  margin:0 0 7px;
  font-size:31px;
  line-height:1.18;
  background:linear-gradient(90deg,#fff,#b198ff,#62dcff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.msg{
  display:flex;
  gap:9px;
  align-items:flex-start;
}

.msg.user{
  justify-content:flex-end;
}

.avatar{
  width:30px;
  height:30px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--a),var(--b));
  font-size:14px;
  flex:0 0 auto;
}

.user .avatar{
  display:none;
}

.bubble{
  max-width:93%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.62;
  white-space:pre-wrap;
  word-break:break-word;
}

.assistant .bubble{
  background:var(--panel);
  border:1px solid var(--line);
  border-top-left-radius:7px;
}

.user .bubble{
  background:linear-gradient(135deg,#7052f5,#5b43d5);
  border-bottom-right-radius:6px;
}

.examples{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:10px;
}

.example{
  width:100%;
  text-align:left;
  background:#1a1d29;
  border:1px solid #34384b;
  border-radius:13px;
  padding:10px 11px;
  line-height:1.45;
}

.example:active{
  transform:scale(.99);
}

.image-card{
  margin-top:10px;
  background:#090a10;
  border:1px solid var(--line);
  border-radius:18px;
  padding:8px;
}

.image-card img{
  display:block;
  width:100%;
  border-radius:13px;
}

.image-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.image-actions>*{
  flex:1;
  background:#1a1d29;
  border:1px solid #34384b;
  border-radius:12px;
  padding:10px;
  text-align:center;
  font-weight:800;
  text-decoration:none;
}

.statusline{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
  color:#9298ad;
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#7b5cff;
  box-shadow:0 0 12px #7b5cff;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.3;
    transform:scale(.7);
  }
}

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,#08090f 28%);
}

.composer{
  max-width:820px;
  margin:auto;
  background:#141621f7;
  border:1px solid #363a4e;
  border-radius:22px;
  padding:8px;
  box-shadow:0 14px 45px #000c;
}

.preview{
  display:none;
  align-items:center;
  gap:8px;
  padding:2px 2px 8px;
}

.preview.show{
  display:flex;
}

.preview img{
  width:53px;
  height:53px;
  object-fit:cover;
  border-radius:10px;
}

.preview span{
  flex:1;
  color:var(--muted);
  font-size:12px;
}

.preview button{
  background:#292d3d;
  border-radius:9px;
  padding:6px 9px;
}

textarea{
  width:100%;
  min-height:48px;
  max-height:155px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:7px 8px;
  line-height:1.5;
}

.bottom{
  display:flex;
  align-items:center;
  gap:8px;
}

.iconbtn,
.send{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
}

.iconbtn{
  background:#202331;
  border:1px solid #303448;
  font-size:22px;
}

.send{
  margin-left:auto;
  background:linear-gradient(135deg,var(--a),var(--b));
  font-size:20px;
  font-weight:900;
}

.send:disabled{
  opacity:.45;
}

.hint{
  text-align:center;
  color:#73788d;
  font-size:10px;
  margin-top:5px;
}

.drawer{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  background:#0008;
}

.drawer.open{
  display:block;
}

.drawer-panel{
  width:min(88vw,340px);
  height:100%;
  background:#0d0f18;
  border-right:1px solid var(--line);
  padding:16px;
  overflow:auto;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.drawer h2{
  font-size:17px;
  margin:0;
}

.history{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history button{
  text-align:left;
  background:#161925;
  border:1px solid #2c3040;
  border-radius:13px;
  padding:10px;
}

.history strong{
  display:block;
  font-size:13px;
}

.history small{
  color:var(--muted);
  display:block;
  margin-top:3px;
}

@media(min-width:760px){
  main{
    padding:25px 20px;
  }

  .hero h1{
    font-size:36px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<div class="logo">
✦
</div>

<div>
<strong>Iconia AI</strong>
<small>話すだけで、画像をつくる</small>
</div>

</div>

<div style="display:flex;gap:7px">

<button
class="topbtn"
id="historyBtn">
履歴
</button>

<button
class="topbtn"
id="newBtn">
新しい会話
</button>

</div>

</header>

<main>

<section class="hero">

<h1>
作りたい画像を、普通に話してください。
</h1>

<p>
画像がなくてもオリジナルを作れます。
画像があれば、その画像をベースに編集できます。
ゲーム・X・Instagram・LINE・YouTubeなど、
用途もAIが会話から判断します。
</p>

</section>

<section
class="chat"
id="chat">
</section>

</main>

</div>

<div class="composer-wrap">

<div class="composer">

<div
class="preview"
id="preview">

<img
id="previewImg">

<span>
参考画像を添付中
</span>

<button
id="removeImage">
×
</button>

</div>

<textarea
id="prompt"
rows="1"
placeholder="例：「このキャラでXのヘッダーを作って。夜の東京、青いネオン。キャラは左側。」">
</textarea>

<div class="bottom">

<button
class="iconbtn"
id="uploadBtn">
＋
</button>

<input
id="fileInput"
type="file"
accept="image/png,image/jpeg,image/webp"
hidden>

<span
id="status"
style="color:#9298ad;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
</span>

<button
class="send"
id="send">
↑
</button>

</div>

<div class="hint">
画像なし＝オリジナル　／　画像あり＝編集　／　Enter＝送信
</div>

</div>
</div>

<div
class="drawer"
id="drawer">

<div class="drawer-panel">

<div class="drawer-head">

<h2>
最近の作品
</h2>

<button
class="topbtn"
id="closeDrawer">
閉じる
</button>

</div>

<div
class="history"
id="history">
</div>

</div>

</div>

<script>

const chat =
document.getElementById("chat");

const promptEl =
document.getElementById("prompt");

const sendBtn =
document.getElementById("send");

const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

const previewImg =
document.getElementById("previewImg");

const statusEl =
document.getElementById("status");

const drawer =
document.getElementById("drawer");

const historyEl =
document.getElementById("history");

let state = {
  id:null,
  title:"新しい作品",
  messages:[],
  image:null,
  previousResponseId:null,
  updatedAt:Date.now()
};

let busy=false;

const EXAMPLES=[

"完全オリジナルの男性キャラクター。黒髪、黒い服、青い炎。冷酷で強そう。ゲームアイコン向けに人物を大きくして。",

"このキャラクターを使ってXのヘッダーを作って。夜の東京、青いネオン、キャラクターは左側。高級感のある雰囲気で。",

"まだイメージが決まってない。SNSで使いたくなるカッコいいオリジナルキャラクターを3案考えて、その中から1つ作って。"

];

function uid(){

return "c_"+
Date.now()+
"_"+Math.random()
.toString(36)
.slice(2,8);

}

function saveState(){

state.updatedAt=Date.now();

try{

localStorage.setItem(
"iconia_current",
JSON.stringify(state)
);

}catch(e){}

const list=
JSON.parse(
localStorage.getItem(
"iconia_history"
) || "[]"
)
.filter(
x=>x.id!==state.id
);

list.unshift({

id:state.id,
title:state.title,
image:state.image,
updatedAt:state.updatedAt,
messages:state.messages.slice(-12),
previousResponseId:
state.previousResponseId

});

localStorage.setItem(
"iconia_history",
JSON.stringify(
list.slice(0,20)
)
);

renderHistory();

}

function loadState(){

try{

const saved=
JSON.parse(
localStorage.getItem(
"iconia_current"
) || "null"
);

if(saved&&saved.id){

state=saved;

renderMessages();

return true;

}

}catch(e){}

return false;

}

function renderMessages(){

chat.innerHTML="";

if(!state.messages.length){

welcome();

return;

}

state.messages.forEach(
m=>
addMessage(
m.role,
m.text,
m.extra || {},
false
)
);

}

function addMessage(
role,
text,
extra={},
store=true
){

const row=
document.createElement("div");

const bubble=
document.createElement("div");

const avatar=
document.createElement("div");

row.className=
"msg "+role;

avatar.className="avatar";

avatar.textContent=
role==="assistant"
?"✦"
:"";

bubble.className="bubble";

if(extra.typing){

bubble.innerHTML=
'<span class="typing">● ● ●</span>';

}else{

bubble.textContent=
text || "";

}

if(extra.inputImage){

const w=
document.createElement("div");

w.className=
"attach-in-chat";

const im=
document.createElement("img");

im.src=
extra.inputImage;

im.style.cssText=
"width:58px;height:58px;object-fit:cover;border-radius:9px";

const s=
document.createElement("span");

s.textContent=
"参考画像";

w.append(im,s);

bubble.appendChild(w);

}

if(extra.image){

const card=
document.createElement("div");

card.className=
"image-card";

const im=
document.createElement("img");

im.src=
extra.image;

im.alt=
"生成画像";

const actions=
document.createElement("div");

actions.className=
"image-actions";

const a=
document.createElement("a");

a.href=
extra.image;

a.download=
"iconia-ai.png";

a.textContent=
"↓ 保存";

const b=
document.createElement("button");

b.textContent=
"この画像を続けて編集";

b.onclick=()=>{

state.image=
extra.image;

showPreview();

promptEl.focus();

};

actions.append(a,b);

card.append(
im,
actions
);

bubble.appendChild(card);

}

if(
extra.examples &&
extra.examples.length
){

const box=
document.createElement("div");

box.className=
"examples";

extra.examples
.slice(0,3)
.forEach(v=>{

const b=
document.createElement("button");

b.className=
"example";

b.textContent=
"💡 "+v;

b.onclick=()=>{

promptEl.value=v;

autoSize();

promptEl.focus();

};

box.appendChild(b);

});

bubble.appendChild(box);

}

if(extra.status){

const s=
document.createElement("div");

s.className=
"statusline";

s.innerHTML=
'<span class="dot"></span>'+
extra.status;

bubble.appendChild(s);

}

row.append(
avatar,
bubble
);

chat.appendChild(row);

row.scrollIntoView({
behavior:"smooth",
block:"end"
});

if(store){

state.messages.push({

role,
text,
extra:{
...extra,
typing:undefined
}

});

saveState();

}

return row;

}

function welcome(){

addMessage(
"assistant",

`こんにちは。Iconia AIです。

ここでは設定を細かく選ぶ必要はありません。
作りたい画像を、ChatGPTに話しかけるように普通の言葉で伝えてください。

画像がなくてもオリジナル画像を作れます。
画像を送れば、その画像をベースに編集できます。

「ゲームアイコン」「Xのヘッダー」「Instagram」「LINE」「YouTube」など、用途も会話から判断します。

まだイメージが決まっていなくても大丈夫です。

例えば👇`,

{
examples:EXAMPLES
}

);

}

function showPreview(){

if(state.image){

previewImg.src=
state.image;

preview.classList.add(
"show"
);

}else{

preview.classList.remove(
"show"
);

previewImg.removeAttribute(
"src"
);

}

}

function autoSize(){

promptEl.style.height=
"auto";

promptEl.style.height=
Math.min(
promptEl.scrollHeight,
155
)+"px";

}

function setBusy(v){

busy=v;

sendBtn.disabled=v;

statusEl.textContent=
v
?"生成中…"
:"";

}

async function compressImage(file){

const src=
await new Promise(
(r,j)=>{

const x=
new FileReader();

x.onload=
()=>r(x.result);

x.onerror=j;

x.readAsDataURL(file);

}
);

const img=
await new Promise(
(r,j)=>{

const x=
new Image();

x.onload=
()=>r(x);

x.onerror=j;

x.src=src;

}
);

const max=1200;

const scale=
Math.min(
1,
max/
Math.max(
img.width,
img.height
)
);

const c=
document.createElement(
"canvas"
);

c.width=
Math.round(
img.width*scale
);

c.height=
Math.round(
img.height*scale
);

c.getContext("2d")
.drawImage(
img,
0,
0,
c.width,
c.height
);

return c.toDataURL(
"image/jpeg",
.82
);

}

async function send(){

if(busy)return;

const text=
promptEl.value.trim();

if(
!text &&
!state.image
)return;

const inputImage=
state.image;

addMessage(
"user",
text ||
"この画像をベースに編集してください。",
{
inputImage
}
);

promptEl.value="";

autoSize();

setBusy(true);

const typing=
addMessage(
"assistant",
"",
{
typing:true,
status:
"内容を理解しています…"
}
);

try{

const r=
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:
text ||
"この画像をベースに編集してください。",

image:
inputImage,

previousResponseId:
state.previousResponseId

})

}
);

const d=
await r.json();

typing.remove();

if(!r.ok){

throw new Error(
d.error ||
"処理に失敗しました。"
);

}

state.previousResponseId=
d.responseId ||
state.previousResponseId;

if(d.image){

state.image=
d.image;

showPreview();

addMessage(
"assistant",
d.reply ||
"できました。さらに修正できます。",
{
image:d.image,
examples:
d.examples || []
}
);

}else{

addMessage(
"assistant",
d.reply ||
"もちろんです。もう少し希望を教えてください。",
{
examples:
d.examples || []
}
);

}

saveState();

}catch(e){

typing.remove();

addMessage(
"assistant",
"うまく処理できませんでした。\n\n"+
e.message
);

saveState();

}finally{

setBusy(false);

}

}

function renderHistory(){

historyEl.innerHTML="";

const list=
JSON.parse(
localStorage.getItem(
"iconia_history"
) || "[]"
);

if(!list.length){

historyEl.innerHTML=
'<div style="color:#888;font-size:13px">まだ作品はありません。</div>';

return;

}

list.forEach(
item=>{

const b=
document.createElement(
"button"
);

const title=
document.createElement(
"strong"
);

title.textContent=
item.title ||
"作品";

const small=
document.createElement(
"small"
);

small.textContent=
new Date(
item.updatedAt
).toLocaleString(
"ja-JP"
);

b.append(
title,
small
);

b.onclick=()=>{

state={

id:item.id,

title:item.title,

image:item.image || null,

previousResponseId:
item.previousResponseId || null,

updatedAt:item.updatedAt,

messages:item.messages || []

};

localStorage.setItem(
"iconia_current",
JSON.stringify(state)
);

drawer.classList.remove(
"open"
);

renderMessages();

showPreview();

};

historyEl.appendChild(b);

}
);

}

function newChat(){

if(busy)return;

state={

id:uid(),

title:"新しい作品",

messages:[],

image:null,

previousResponseId:null,

updatedAt:Date.now()

};

localStorage.setItem(
"iconia_current",
JSON.stringify(state)
);

promptEl.value="";

autoSize();

showPreview();

renderMessages();

}

document.getElementById(
"uploadBtn"
).onclick=
()=>fileInput.click();

fileInput.onchange=
async()=>{

const f=
fileInput.files?.[0];

if(!f)return;

state.image=
await compressImage(f);

showPreview();

statusEl.textContent=
"画像を添付しました";

saveState();

setTimeout(
()=>{

if(!busy)
statusEl.textContent="";

},
1400
);

};

document.getElementById(
"removeImage"
).onclick=
()=>{

state.image=null;

fileInput.value="";

showPreview();

saveState();

};

promptEl.oninput=
autoSize;

promptEl.onkeydown=
e=>{

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

send();

}

};

document.addEventListener(
"paste",
async e=>{

const item=
[
...(e.clipboardData?.items || [])
]
.find(
x=>x.type.startsWith(
"image/"
)
);

if(!item)return;

const f=
item.getAsFile();

if(!f)return;

e.preventDefault();

state.image=
await compressImage(f);

showPreview();

saveState();

statusEl.textContent=
"貼り付けた画像を添付しました";

setTimeout(
()=>{

if(!busy)
statusEl.textContent="";

},
1400
);

}
);

sendBtn.onclick=
send;

document.getElementById(
"newBtn"
).onclick=
newChat;

document.getElementById(
"historyBtn"
).onclick=
()=>{

renderHistory();

drawer.classList.add(
"open"
);

};

document.getElementById(
"closeDrawer"
).onclick=
()=>drawer.classList.remove(
"open"
);

drawer.onclick=
e=>{

if(e.target===drawer)
drawer.classList.remove(
"open"
);

};

if(
!loadState()
){

state.id=uid();

welcome();

saveState();

}else{

showPreview();

renderHistory();
