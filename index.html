<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME ICON AI</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070809;
  color:#f5f5f5;
  font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
  width:min(100% - 24px,720px);
  margin:auto;
  padding:25px 0 60px;
}

/* HEADER */

.header{
  text-align:center;
  padding:25px 10px 35px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#d8b55d;
}

.subtitle{
  margin-top:8px;
  color:#858b91;
  font-size:13px;
}


/* CARD */

.card{
  background:#101214;
  border:1px solid #282c30;
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
}

.title{
  font-size:16px;
  font-weight:800;
  margin-bottom:7px;
}

.description{
  color:#858b91;
  font-size:12px;
  line-height:1.7;
  margin-bottom:16px;
}


/* MODE */

.mode-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.mode{
  min-height:135px;
  padding:16px 12px;

  background:#0a0c0e;
  border:1px solid #292d31;
  border-radius:15px;

  color:white;
  text-align:left;

  cursor:pointer;

  transition:.2s;
}

.mode:hover{
  border-color:#777;
}

.mode.active{
  border-color:#d8b55d;
  background:rgba(216,181,93,.08);

  box-shadow:
    0 0 0 1px rgba(216,181,93,.1);
}

.mode-icon{
  font-size:25px;
  margin-bottom:15px;
}

.mode-name{
  font-size:13px;
  font-weight:800;
}

.mode-description{
  margin-top:5px;
  color:#737980;
  font-size:10px;
  line-height:1.5;
}


/* UPLOAD */

.upload{
  height:240px;

  border:1px dashed #41464b;
  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  overflow:hidden;

  background:#0a0c0e;

  cursor:pointer;
}

.upload:hover{
  border-color:#d8b55d;
}

#imageInput{
  display:none;
}

.upload-content{
  text-align:center;
}

.upload-icon{
  font-size:34px;
  margin-bottom:10px;
  color:#c5c9cd;
}

.upload-title{
  font-size:14px;
  font-weight:800;
}

.upload-description{
  color:#686f76;
  font-size:10px;
  margin-top:6px;
}

.preview{
  display:none;

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#070809;
}

.change-button{
  display:none;

  position:absolute;
  right:10px;
  bottom:10px;

  background:rgba(0,0,0,.85);

  color:white;

  border:1px solid #444;

  border-radius:9px;

  padding:8px 12px;

  font-size:10px;
}


/* INPUT */

input[type="text"],
textarea{
  width:100%;

  background:#090b0d;

  border:1px solid #292e33;

  border-radius:13px;

  color:white;

  outline:none;

  padding:13px;

  font-size:13px;
}

input[type="text"]{
  height:52px;
}

textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.7;
}

input:focus,
textarea:focus{
  border-color:#9b8147;

  box-shadow:
    0 0 0 3px rgba(216,181,93,.08);
}

input::placeholder,
textarea::placeholder{
  color:#5d646b;
}


/* OPTIONS */

.option-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.option{
  padding:14px;

  background:#090b0d;

  border:1px solid #292e33;

  border-radius:13px;

  color:white;

  text-align:left;

  cursor:pointer;
}

.option.active{
  border-color:#d8b55d;

  background:rgba(216,181,93,.08);
}

.option-name{
  font-size:12px;
  font-weight:800;
}

.option-description{
  color:#696f76;
  font-size:9px;
  margin-top:4px;
}


/* COLORS */

.colors{
  display:flex;
  gap:13px;
}

.color{
  width:36px;
  height:36px;

  border-radius:50%;

  border:2px
