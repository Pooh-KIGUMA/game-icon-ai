<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<title>Iconia AI</title>
<style>
:root{color-scheme:dark;--bg:#080910;--panel:#151822;--line:#2c3040;--text:#f5f6fa;--muted:#8e94a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}button,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh}.header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#080910e8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.brand{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#7355ff,#08c9ff);box-shadow:0 8px 30px #4030aa55}.brand b{font-size:19px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.headBtns{display:flex;gap:7px}.headBtn{background:#171923;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}.chat{max-width:900px;margin:auto;padding:12px 12px 190px}.welcome{text-align:center;padding:35px 8px 25px}.bigLogo{width:68px;height:68px;margin:auto;border-radius:21px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#7355ff,#08c9ff)}.welcome h1{font-size:27px;margin:16px 0 8px}.welcome p{color:var(--muted);line-height:1.7;margin:0 auto;max-width:620px}.examples{display:grid;gap:9px;max-width:650px;margin:20px auto}.example{background:#12141c;border:1px solid var(--line);border-radius:16px;padding:13px 15px;text-align:left;color:#e0e3eb}.row{display:flex;margin:16px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(90%,720px);padding:12px 14px;border-radius:20px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:linear-gradient(135deg,#674cff,#5140d7);border-bottom-right-radius:6px}.bubble.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}.bubble img{display:block;max-width:100%;width:min(520px,100%);margin-top:9px;border-radius:14px;background:#05060a}.ref{display:flex;align-items:center;gap:9px;margin-top:9px;padding:7px;background:#0003;border-radius:11px}.ref img{width:56px;height:56px;object-fit:cover;border-radius:8px}.save{display:inline-block;margin-top:9px;padding:8px 11px;border-radius:10px;background:#252937;text-decoration:none;color:#fff;font-size:12px}.error{background:#35191d;border:1px solid #6d2a32;color:#ffb9b9;padding:13px 14px;border-radius:15px}.error button{margin-top:10px;background:#54242a;padding:8px 12px;border-radius:10px}.loading{display:flex;align-items:center;gap:9px;color:#a1a6b7;padding:10px 2px}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#775eff;animation:b 1.05s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes b{0%,65%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}.composerWrap{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 70%,transparent)}.composer{max-width:900px;margin:auto;background:#151722;border:1px solid #303445;border-radius:22px;overflow:hidden;box-shadow:0 12px 45px #0008}.attachment{display:none;padding:9px 11px;border-bottom:1px solid var(--line)}.attachment.show{display:flex;align-items:center;gap:9px}.attachment img{width:58px;height:58px;object-fit:cover;border-radius:9px}.attachment div{flex:1}.attachment strong{font-size:12px}.attachment small{display:block;color:var(--muted);margin-top:2px}.remove{width:34px;height:34px;border-radius:50%;background:#252936}.input{display:flex;gap:7px;align-items:flex-end;padding:9px}.iconBtn,.send{width:46px;height:46px;border-radius:15px;background:#252937;font-size:23px;flex:none}.send{background:linear-gradient(135deg,#7355ff,#08c9ff);font-size:21px}.send:disabled{opacity:.35}.text{flex:1;min-height:46px;max-height:170px;resize:none;outline:none;border:0;background:transparent;color:var(--text);padding:12px 3px;line-height:1.5}.text::placeholder{color:#777d90}.hint{text-align:center;color:#707688;font-size:10px;padding:0 12px 9px}.drawer{position:fixed;inset:0;z-index:50;background:#000b;display:none}.drawer.show{display:block}.drawerBox{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);width:min(390px,calc(100% - 20px));max-height:80vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:22px;padding:15px}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{width:36px;height:36px;border-radius:50%;background:#252937}.history{display:grid;gap:8px;margin-top:10px}.historyItem{background:#1a1d27;border:1px solid var(--line);border-radius:13px;padding:11px}.historyItem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem small{display:block;color:var(--muted);margin-top:4px}@media(max-width:600px){.brand b{font-size:18px}.headBtn{padding:9px 10px;font-size:12px}.welcome h1{font-size:24px}.bubble{max-width:93%}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">✦</div><div><b>Iconia AI</b><span>話すだけで、画像をつくる</span></div></div><div class="headBtns"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div></header>
<main class="chat" id="chat"></main>
<div class="composerWrap"><div class="composer"><div class="attachment" id="attachment"><img id="attachPreview"><div><strong>参考画像</strong><small>この画像を使って編集</small></div><button class="remove" id="remove">×</button></div><div class="input"><button class="iconBtn" id="attachBtn" title="画像を追加">＋</button><textarea id="text" class="text" placeholder="作りたい画像を自由に説明してください…" rows="1"></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint">画像なし＝オリジナル　／　画像あり＝編集　／　Enter＝改行</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="drawerBox"><div class="drawerHead"><b>会話履歴</b><button class="close" id="close">×</button></div><div class="history" id="history"></div></div></div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const KEY='iconia_v5';let state=loadState(),pendingImage=null,sending=false,retryText='';const $=id=>document.getElementById(id);
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{messages:[],lastImage:null}}catch{return{messages:[],lastImage:null}}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-24),lastImage:state.lastImage}))}catch{try{state.messages=state.messages.slice(-10);localStorage.setItem(KEY,JSON.stringify(state))}catch{}}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isNew(t){return /^(新しく|新規|別の|もう一枚|もう1枚|違う画像|別バージョン|新しい)/.test(t.trim())}
function reuse(t){if(!state.lastImage||isNew(t))return false;return /さっき|前の|この画像|このキャラ|これ|そのまま|もう少し|もっと|背景|髪|顔|服|目|文字|ポーズ|構図|明る|暗|色|大き|小さ|右|左|上|下|消して|追加|変更|修正|直して|編集|このまま/.test(t)}
function render(){const c=$('chat');c.innerHTML='';if(!state.messages.length){c.innerHTML='<section class="welcome"><div class="bigLogo">✦</div><h1>自分だけの画像を、話すだけで。</h1><p>作りたいものを普通に話してください。画像を貼れば、その画像を元に編集できます。</p><div class="examples"><button class="example">💡 クールな男性キャラクターを作って。黒髪、黒い服、青い光。ゲームアイコン向け。</button><button class="example">💡 このキャラクターを使ってXのヘッダーを作って。夜の東京、青いネオン。人物は左側。</button><button class="example">💡 オリジナルのゲームアイコンを作って。</button></div></section>'}else{state.messages.forEach(m=>{const r=document.createElement('div');r.className='row '+m.role;const b=document.createElement('div');b.className='bubble '+m.role;b.innerHTML='<div>'+esc(m.text)+'</div>';if(m.image){const im=document.createElement('img');im.src=m.image;im.alt='生成画像';b.appendChild(im);const a=document.createElement('a');a.className='save';a.href=m.image;a.download='iconia-ai.jpg';a.textContent='画像を保存';b.appendChild(a)}if(m.ref){const q=document.createElement('div');q.className='ref';q.innerHTML='<img src="'+m.ref+'"><small>参考画像</small>';b.appendChild(q)}r.appendChild(b);c.appendChild(r)})}if(sending){const r=document.createElement('div');r.className='row ai';r.innerHTML='<div class="bubble ai"><div class="loading">画像を作っています… <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div></div>';c.appendChild(r)}if(retryText&&!sending){const r=document.createElement('div');r.className='row ai';r.innerHTML='<div class="bubble ai error"><div>うまく処理できませんでした。</div><div>'+esc(retryText)+'</div><button id="retry">もう一度</button></div>';c.appendChild(r);setTimeout(()=>{const x=$('retry');if(x)x.onclick=()=>{const t=retryText;retryText='';sendMessage(t,true)}},0)}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function resizeText(){const t=$('text');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,170)+'px';$('send').disabled=!t.value.trim()||sending}
async function compressFile(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1536,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.86))};img.onerror=reject;img.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
function extractExactText(message){const t=String(message||'').trim();if(!t)return null;const quoted=t.match(/[「『“"]([^」』”"]{1,80})[」』”"]/u);if(quoted?.[1]?.trim())return quoted[1].trim();const named=t.match(/([A-Za-z][A-Za-z0-9._-]{0,39})\s*(?:の|という)\s*(?:文字|テキスト|ロゴ)\s*(?:を|は)?/i);if(named?.[1])return named[1].trim();const named2=t.match(/([A-Za-z][A-Za-z0-9._-]{0,39})\s*(?:を|って)\s*(?:入れて|追加して|加えて|書いて|載せて|入れたい|追加したい)/i);if(named2?.[1])return named2[1].trim();const explicit=t.match(/(?:文字|テキスト|ロゴ|名前|チーム名|クラン名|同盟名)\s*(?:は|を|：|:)\s*[「『“"]?([A-Za-z0-9._-]{1,60})/u);if(explicit?.[1]&&!/^(入れて|追加して|加えて|書いて|載せて|ください)$/u.test(explicit[1]))return explicit[1].trim();return null}
function looksLikeTextOnly(message){const t=String(message||'');const exact=extractExactText(t);if(!exact)return false;if(/AI(?:に|が)?(?:書き直|描き直|再デザイン|デザイン)|AIデザイン|全体を.*(?:再|デザイン)|雰囲気.*(?:変え|変えて)|構図.*(?:変え|変えて)|背景.*(?:変え|変更)|ポーズ.*(?:変え|変更)/u.test(t))return false;return /文字|テキスト|ロゴ|名前|チーム|クラン|同盟|原画|元画像|そのまま|追加|入れて|書いて|カッコよく|かっこよく|デザイン/u.test(t)}
function overlayStyle(message){const t=String(message||'');let colors=['#FFFFFF','#65C7FF','#5138FF'];if(/金|ゴールド|gold/i.test(t))colors=['#FFFCE0','#FFD45A','#8A4B00'];else if(/紫|パープル|purple/i.test(t))colors=['#FFFFFF','#D08CFF','#5B16B5'];else if(/赤|レッド|red/i.test(t))colors=['#FFFFFF','#FF5C6D','#8E1020'];else if(/青|ブルー|blue/i.test(t))colors=['#FFFFFF','#54D9FF','#1646FF'];else if(/ピンク|pink/i.test(t))colors=['#FFFFFF','#FF82D2','#9D42FF'];else if(/緑|グリーン|green/i.test(t))colors=['#FFFFFF','#67F09A','#087A4A'];else if(/黒|ブラック|black/i.test(t))colors=['#FFFFFF','#AAB5C5','#161A22'];return{colors}}
async function applyOverlay(dataUrl,overlay){if(!overlay?.text)return dataUrl;return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const t=String(overlay.text).trim();const m=String(overlay.message||'');const min=Math.min(c.width,c.height);let size=Math.round(min*(/かなり大き|とても大き|超大き/.test(m)?.135:/大きく|大きめ|カッコよく|かっこよく|ゲームクラ/.test(m)?.115:.10));size=Math.max(54,Math.min(size,Math.floor(c.width/2.05)));let x=c.width/2,y=c.height-Math.round(c.height*.10),align='center';if(/右下/.test(m)){x=c.width-Math.round(c.width*.055);align='right'}else if(/左下/.test(m)){x=Math.round(c.width*.055);align='left'}else if(/右上/.test(m)){x=c.width-Math.round(c.width*.055);y=Math.round(c.height*.13);align='right'}else if(/左上/.test(m)){x=Math.round(c.width*.055);y=Math.round(c.height*.13);align='left'}else if(/中央|真ん中|センター/.test(m))y=Math.round(c.height*.55);const s=overlayStyle(m),g=ctx.createLinearGradient(0,y-size,0,y+size);g.addColorStop(0,s.colors[0]);g.addColorStop(.45,s.colors[1]);g.addColorStop(1,s.colors[2]);ctx.save();ctx.translate(x,y);ctx.rotate((/斜め|斜体/.test(m)?-4:-2)*Math.PI/180);ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font='900 '+size+'px Impact, Haettenschweiler, "Arial Black", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif';ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=size*.055;ctx.shadowOffsetY=size*.065;ctx.lineWidth=Math.max(10,size*.10);ctx.strokeStyle='#05060B';ctx.strokeText(t,0,0);ctx.shadowColor='transparent';ctx.lineWidth=Math.max(5,size*.045);ctx.strokeStyle='rgba(255,255,255,.92)';ctx.strokeText(t,0,0);ctx.fillStyle=g;ctx.fillText(t,0,0);ctx.lineWidth=Math.max(2,size*.018);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeText(t,0,0);ctx.restore();resolve(c.toDataURL('image/jpeg',.96))}catch(e){reject(e)}};img.onerror=reject;img.src=dataUrl})}
async function sendMessage(forced=null,retry=false){if(sending)return;const t=(forced??$('text').value).trim();if(!t&&!pendingImage)return;const attached=pendingImage;const image=attached||(!isNew(t)&&reuse(t)?state.lastImage:null);const aiDesign=!!image&&/AI(?:に|が)?(?:書き直|描き直|再デザイン|デザイン)|AIデザイン|全体を.*(?:再|デザイン)|雰囲気.*(?:変え|変えて)|構図.*(?:変え|変えて)/u.test(t);sending=true;retryText='';if(!retry){state.messages.push({role:'user',text:t||'この画像を編集して',ref:attached||null});saveState()}$('text').value='';pendingImage=null;$('attachment').classList.remove('show');resizeText();render();try{const history=state.messages.slice(-10).map(x=>({role:x.role,text:x.text}));const res=await fetch('/api/generate.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t||'この画像を自然に編集して',image,history,aiDesign})});let data=null;try{data=await res.json()}catch{}if(!res.ok||!data?.success)throw new Error(data?.error||'サーバーから画像を受け取れませんでした。');let finalImage=data.image;if(data.overlay){let ov={...data.overlay};const exact=extractExactText(t);if(exact&&looksLikeTextOnly(t))ov.text=exact;finalImage=await applyOverlay(data.image,ov)}state.lastImage=finalImage;state.messages.push({role:'ai',text:data.reply||'できました。気になるところがあれば、そのまま続けて指示してください。',image:finalImage});saveState()}catch(e){retryText=e?.message||'通信エラーが発生しました。'}finally{sending=false;render();resizeText()}}
$('send').onclick=()=>sendMessage();$('text').addEventListener('input',resizeText);$('text').addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.isComposing)return;e.preventDefault();const t=e.currentTarget,s=t.selectionStart,v=t.value;t.value=v.slice(0,s)+'\n'+v.slice(s);t.selectionStart=t.selectionEnd=s+1;resizeText()}});$('attachBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingImage=await compressFile(f);$('attachPreview').src=pendingImage;$('attachment').classList.add('show')}catch{alert('画像を読み込めませんでした。')}e.target.value=''};$('remove').onclick=()=>{pendingImage=null;$('attachment').classList.remove('show')};$('newBtn').onclick=()=>{state={messages:[],lastImage:null};pendingImage=null;retryText='';saveState();$('text').value='';resizeText();render()};$('historyBtn').onclick=()=>{$('drawer').classList.add('show');const h=$('history');h.innerHTML=state.messages.length?'<div class="historyItem"><b>現在の会話</b><small>'+state.messages.length+'件のメッセージ</small></div>':'<small style="color:#8e94a6">まだ会話履歴はありません。</small>'};$('close').onclick=()=>$('drawer').classList.remove('show');document.addEventListener('click',e=>{if(e.target.classList.contains('example')){$('text').value=e.target.textContent.replace(/^💡\s*/,'');resizeText();$('text').focus()}});window.addEventListener('pagehide',saveState);window.addEventListener('beforeunload',saveState);resizeText();render();
</script>
</body>
</html>
