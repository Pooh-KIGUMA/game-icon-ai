<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Iconia AI — 高精度ゲームアイコンAI</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--panel:#12151e;--panel2:#181c28;--line:#2b3141;--text:#f6f7fb;--muted:#8e96aa;--a:#7657ff;--c:#0bc8ff;--good:#5be0bd;--bad:#ff7b86}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(900px 500px at 50% -260px,#2a1b63 0,#07080d 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}button,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.header{position:sticky;top:0;z-index:50;height:74px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#08090eea;backdrop-filter:blur(22px);border-bottom:1px solid #ffffff0b}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 12px 40px #4e3bca55;font-size:24px}.brand b{font-size:19px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.actions{display:flex;gap:8px}.headBtn{background:#151822;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:750;font-size:12px}.layout{display:flex;max-width:1280px;margin:auto}.side{width:245px;position:fixed;top:74px;bottom:0;padding:18px 12px;background:#0a0b11;border-right:1px solid #ffffff09;display:none}.side button{width:100%;text-align:left;background:transparent;padding:12px;border-radius:12px}.side button:hover,.side button.active{background:#171a25}.sideTitle{color:#737b8e;font-size:10px;padding:18px 12px 9px}.main{width:100%;max-width:980px;margin:auto;padding:0 14px 265px}.welcome{text-align:center;padding:58px 10px 30px}.bigLogo{display:grid;place-items:center;width:82px;height:82px;margin:auto;border-radius:27px;background:linear-gradient(135deg,var(--a),var(--c));font-size:38px;box-shadow:0 18px 70px #4e3bca66}.welcome h1{font-size:34px;margin:20px 0 10px}.welcome p{color:var(--muted);max-width:720px;margin:auto;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:850px;margin:25px auto}.card{padding:13px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#131620,#0f1119);text-align:left;font-size:12px}.card span{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.45}.row{display:flex;margin:20px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(94%,850px);padding:13px 15px;border-radius:22px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#694cff,#5541df);border-bottom-right-radius:7px}.ai .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:7px;box-shadow:0 10px 40px #0003}.result{display:block;width:min(780px,100%);margin-top:12px;border-radius:17px;background:#05060a;cursor:zoom-in}.saveHint{display:flex;align-items:center;gap:7px;margin-top:8px;color:#9da6ba;font-size:11px;line-height:1.45}.saveHint b{color:#dce1eb}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool{background:#242938;border:1px solid #34394b;padding:8px 11px;border-radius:10px;font-size:11px}.loading{color:#cfd3df}.progress{display:flex;gap:7px;align-items:center;margin-top:7px;color:#aeb5c5;font-size:12px}.progress .pDot{width:8px;height:8px;border-radius:50%;background:#816cff;box-shadow:0 0 14px #816cff;animation:pulse 1.1s infinite}.progress small{color:#70788a;font-size:10px}.error{background:#32171b!important;border-color:#6b2931!important;color:#ffb9b9}.meta{color:#70788a;font-size:9px;margin-top:8px}.thinkingLine{display:flex;align-items:center;gap:10px}.spinner{width:18px;height:18px;border-radius:50%;border:2px solid #3a4051;border-top-color:#8d78ff;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35;transform:scale(.78)}}.composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 80%,transparent)}.composer{max-width:980px;margin:auto;background:#151821;border:1px solid #303648;border-radius:24px;box-shadow:0 18px 60px #000b;overflow:hidden}.label{font-size:9px;color:#747c90;padding:8px 12px 0}.bar{display:flex;gap:7px;overflow:auto;padding:7px 0 3px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.chip{white-space:nowrap;background:#171b26;border:1px solid #2c3242;padding:8px 11px;border-radius:999px;font-size:10px;color:#cdd2df}.chip.active{border-color:#705df0;background:#2a2257;color:white}.attach{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.attach.show{display:flex}.attach img{width:62px;height:62px;object-fit:cover;border-radius:10px}.attachInfo{flex:1}.attachInfo b{font-size:12px}.attachInfo small{display:block;color:var(--muted);margin-top:3px}.remove{width:34px;height:34px;border-radius:50%;background:#282d3c;font-size:20px}.input{display:flex;align-items:flex-end;gap:8px;padding:9px}.iconBtn,.send{width:48px;height:48px;border-radius:15px;background:#272c3b;flex:none;font-size:24px}.send{background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 8px 25px #385ee755}.send:disabled{opacity:.3;box-shadow:none}.text{flex:1;min-height:48px;max-height:190px;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:12px 3px;line-height:1.55}.text::placeholder{color:#737b8f}.hint{text-align:center;color:#6d7487;font-size:10px;padding:0 12px 10px}.drawer,.lightbox{position:fixed;inset:0;z-index:100;background:#000c;display:none}.drawer.show,.lightbox.show{display:block}.drawerBox{position:absolute;right:10px;top:10px;width:min(440px,calc(100% - 20px));max-height:88vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:22px;padding:15px}.drawerHead{display:flex;justify-content:space-between}.close,.lightClose{width:38px;height:38px;border-radius:50%;background:#282d3c;font-size:20px}.history{display:grid;gap:8px;margin-top:12px}.historyItem{background:#191c26;border:1px solid var(--line);border-radius:13px;padding:11px}.lightbox img{max-width:94vw;max-height:88vh;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px}.lightClose{position:absolute;right:18px;top:18px;width:44px;height:44px}@media(min-width:900px){.side{display:block}.main{margin-left:245px;width:calc(100% - 245px)}.header{padding-left:calc(max(18px,(100vw - 1280px)/2 + 263px));padding-right:max(18px,(100vw - 1280px)/2)}}@media(max-width:700px){.header{height:64px;padding:7px 12px}.brand b{font-size:17px}.headBtn{padding:8px 9px}.welcome{padding-top:40px}.welcome h1{font-size:27px}.grid{grid-template-columns:1fr}.main{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<header class="header"><div class="brand"><div class="logo">✦</div><div><b>Iconia AI</b><span>話すだけで、理想のゲームアイコンを。</span></div></div><div class="actions"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div></header>
<div class="layout"><aside class="side"><button id="sideNew" class="active">＋ 新しい会話</button><div class="sideTitle">ICONIA AI</div><button id="sideHistory">最近の会話</button><button id="clearBtn">会話をリセット</button></aside><main class="main" id="main"></main></div>
<div class="composerWrap"><div class="composer"><div class="label">出力サイズ</div><div class="bar" id="formatBar"><button class="chip active" data-format="icon">🎮 ゲームアイコン 1:1</button><button class="chip" data-format="xheader">𝕏 X / Twitter 3:1</button><button class="chip" data-format="youtube">▶ YouTube 16:9</button><button class="chip" data-format="portrait">▯ 縦長 2:3</button></div><div class="label">編集モード</div><div class="bar" id="modeBar"><button class="chip active" data-mode="auto">自動・高精度</button><button class="chip" data-mode="identity">同一性を最優先</button><button class="chip" data-mode="partial">部分編集</button><button class="chip" data-mode="text">文字・ロゴ</button><button class="chip" data-mode="style">絵柄だけ変更</button><button class="chip" data-mode="background">背景だけ変更</button></div><div class="attach" id="attach"><img id="preview"><div class="attachInfo"><b>参考画像</b><small id="attachLabel">この画像を元に編集します</small></div><button class="remove" id="remove">×</button></div><div class="input"><button class="iconBtn" id="attachBtn">＋</button><textarea id="text" class="text" rows="1" placeholder="作りたい画像を自由に説明してください…"></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint">Enter＝改行 ／ ⌘+Enter・Ctrl+Enter＝送信 ／ 画像あり＝編集</div></div></div>
<div class="drawer" id="drawer"><div class="drawerBox"><div class="drawerHead"><b>会話履歴</b><button class="close" id="close">×</button></div><div class="history" id="history"></div></div></div>
<div class="lightbox" id="lightbox"><button class="lightClose" id="lightClose">×</button><img id="lightImg"></div><input id="file" type="file" accept="image/*" hidden>
<script>
const KEY='iconia_pro_v6';
let state=load(),pending=null,busy=false,mode='auto',format='icon',progressTimer=null;
const $=id=>document.getElementById(id);
function fresh(){return{messages:[],lastImage:null,versions:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-80),lastImage:state.lastImage,versions:(state.versions||[]).slice(-16)}))}catch{}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scrollBottom(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function newConversation(){state=fresh();save();render()}
function uniqueImages(){const out=[];for(let i=state.messages.length-1;i>=0;i--){const im=state.messages[i]?.image;if(im&&!out.includes(im))out.push(im)}return out}
function restorePrevious(){const u=uniqueImages();if(u.length<2)return false;state.lastImage=u[1];state.messages.push({role:'user',text:'戻して'});state.messages.push({role:'ai',text:'元に戻したよ。直前の画像をそのまま復元しました。',image:u[1]});save();render();scrollBottom();return true}
function welcome(){return `<section class="welcome"><div class="bigLogo">✦</div><div style="color:#8f98ab;font-size:10px">● 高精度編集エンジン オンライン</div><h1>自分だけのゲームアイコンを、話すだけで。</h1><p>標準は1:1のゲームアイコン。会話の流れを理解して、人物の同一性を守りながら必要な部分だけを編集します。文字やロゴは画像の雰囲気に合わせて自動デザインします。</p><div class="grid"><div class="card"><b>🧠 会話を理解</b><span>「さっきの画像」「このキャラ」などを文脈から判断。</span></div><div class="card"><b>🛡 同一性を最優先</b><span>人物・顔・髪・服・ポーズを勝手に別人へ変えない。</span></div><div class="card"><b>🎨 自動デザイン</b><span>文字を指定するだけでも、画像に合うロゴ風デザインを自動提案。</span></div><div class="card"><b>✂ 部分編集</b><span>背景・髪・服・文字など、頼まれた場所を中心に編集。</span></div><div class="card"><b>📐 1:1が標準</b><span>ゲームアイコンを基本に、必要なときだけXやYouTubeへ。</span></div><div class="card"><b>💬 普通に会話</b><span>「いい感じ」「ありがとう」などは画像を作らず会話します。</span></div></div></section>`}
function render(){const m=$('main');if(!state.messages.length){m.innerHTML=welcome();return}m.innerHTML=state.messages.map((x,i)=>{if(x.loading)return `<div class="row ai"><div class="bubble loading"><div class="thinkingLine"><span class="spinner"></span><span id="liveProgress">${esc(x.stage||'考えています')}</span></div><div class="progress"><span class="pDot"></span><span>${esc(x.detail||'画像の指示を整理しています')}</span><small>Iconia AI</small></div></div></div>`;const cls=x.role==='user'?'user':'ai';return `<div class="row ${cls}"><div class="bubble">${esc(x.text||'')}${x.image?`<img class="result" src="${x.image}" data-image="${x.image}" alt="生成されたゲームアイコン"><div class="saveHint">📱 <b>保存するには</b> 画像を長押しして「写真に保存」を選択してください</div>`:''}${x.meta?`<div class="meta">${esc(x.meta)}</div>`:''}</div></div>`}).join('');m.querySelectorAll('.result').forEach(img=>img.onclick=()=>openLight(img.dataset.image));scrollBottom()}
function addUser(text){state.messages.push({role:'user',text});}
function addLoading(){state.messages.push({role:'ai',loading:true,stage:'考えています',detail:'会話と画像を理解しています'})}
function setProgress(stage,detail){const x=state.messages.findLast?.(m=>m.loading)||[...state.messages].reverse().find(m=>m.loading);if(!x)return;x.stage=stage;x.detail=detail;render()}
function startProgress(){const started=Date.now();clearInterval(progressTimer);progressTimer=setInterval(()=>{const s=(Date.now()-started)/1000;if(s<3)setProgress('考えています','会話・人物・構図・指示を分析しています');else if(s<11)setProgress('作成中','画像の編集内容を反映しています');else if(s<28)setProgress('仕上げています','文字・構図・画質・サイズを最終調整しています');else setProgress('仕上げています','最終結果を確認しています');},700)}
function stopProgress(){clearInterval(progressTimer);progressTimer=null}
function modeHint(){return mode}
function shouldReuse(t){return !!state.lastImage&&/(さっき|前の|この画像|このキャラ|これ|そのまま|もう少し|もっと|少し|背景|髪|顔|服|目|文字|テキスト|ロゴ|ポーズ|構図|明る|暗|色|大き|小さ|右|左|上|下|消して|追加|変更|修正|直して|編集|タッチ|絵柄|画風|同じ|部分|戻して)/.test(t)}
async function send(){if(busy)return;const text=$('text').value.trim();if(!text&&!pending)return;busy=true;$('send').disabled=true;const image=pending||((shouldReuse(text)||state.lastImage&&/^(いい感じ|いいね|最高|ありがとう|このまま|そのまま)/.test(text))?state.lastImage:null);$('text').value='';$('text').style.height='48px';if(/^(戻して|元に戻して|前の状態に戻して|一つ前に戻して|ひとつ前に戻して|取り消して|undo)$/i.test(text)&&restorePrevious()){busy=false;$('send').disabled=false;$('text').focus();return}addUser(text);pending=null;setAttach(null);addLoading();save();render();scrollBottom();startProgress();try{const history=state.messages.filter(m=>!m.loading).slice(-28).map(m=>({role:m.role,text:m.text||''}));const payload={message:text,image,history,format,mode:modeHint()};const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();stopProgress();state.messages=state.messages.filter(m=>!m.loading);if(!r.ok||!data.success)throw new Error(data.error||'処理に失敗しました。');if(data.chat){state.messages.push({role:'ai',text:data.reply||'いい感じだね。',meta:'会話モード'});save();render();return}if(data.image){state.versions=[...(state.versions||[]),state.lastImage].filter(Boolean).slice(-16);state.lastImage=data.image;state.messages.push({role:'ai',text:data.reply||'できました。',image:data.image,meta:`${data.plan?.formatLabel||({icon:'ゲームアイコン 1:1',xheader:'X / Twitter 3:1',youtube:'YouTube 16:9',portrait:'縦長 2:3'}[format])} ／ ${data.plan?.mode||'高精度編集'}`});save();render();return}state.messages.push({role:'ai',text:data.reply||'できました。'});save();render()}catch(e){stopProgress();state.messages=state.messages.filter(m=>!m.loading);state.messages.push({role:'ai',text:`うまく処理できませんでした。\n${e.message||'もう一度試してください。'}`,meta:'エラー'});save();render()}finally{busy=false;$('send').disabled=!$('text').value.trim()&&!pending;$('text').focus()}}
function setAttach(src){if(src){$('preview').src=src;$('attach').classList.add('show');$('attachLabel').textContent='この画像を元に編集します'}else{$('preview').removeAttribute('src');$('attach').classList.remove('show')}}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$('attachBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{pending=await fileToData(f);setAttach(pending);$('text').focus()}catch{}e.target.value=''};$('remove').onclick=()=>{pending=null;setAttach(null)};
$('text').oninput=()=>{$('send').disabled=busy||(!$('text').value.trim()&&!pending);$('text').style.height='auto';$('text').style.height=Math.min($('text').scrollHeight,190)+'px'};$('text').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();send()}};$('send').onclick=send;
$('newBtn').onclick=newConversation;$('sideNew').onclick=newConversation;$('clearBtn').onclick=newConversation;
$('historyBtn').onclick=()=>{$('drawer').classList.add('show');$('history').innerHTML=state.messages.length?state.messages.filter(m=>m.role==='user').slice(-20).map((m,i)=>`<div class="historyItem"><b>${esc(m.text||'画像編集')}</b><div class="meta">${i+1}</div></div>`).join(''):'<div class="historyItem">まだ会話はありません。</div>'};$('sideHistory').onclick=$('historyBtn').onclick;$('close').onclick=()=>$('drawer').classList.remove('show');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};
$('formatBar').querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;$('formatBar').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b))});$('modeBar').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('modeBar').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b))});
function openLight(src){$('lightImg').src=src;$('lightbox').classList.add('show')}$('lightbox').onclick=e=>{if(e.target===$('lightbox')||e.target===$('lightClose'))$('lightbox').classList.remove('show')};
render();
</script>
</body></html>
