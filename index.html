<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME ICON AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080808;
  --card:#111214;
  --card2:#151619;
  --border:#292c32;
  --gold:#d8b45a;
  --gold2:#f0d37a;
  --text:#f5f5f5;
  --sub:#8f949e;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(216,180,90,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  min-height:100vh;
}

.container{
  width:min(920px,94%);
  margin:auto;
  padding-bottom:80px;
}

/* HEADER */

header{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #202126;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:var(--gold);
}

.language{
  position:relative;
}

.language select{
  appearance:none;
  background:#111216;
  color:white;
  border:1px solid #30343b;
  border-radius:14px;
  padding:14px 42px 14px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.language::after{
  content:"⌄";
  position:absolute;
  right:16px;
  top:11px;
  font-size:20px;
  pointer-events:none;
}

/* HERO */

.hero{
  text-align:center;
  padding:70px 20px 45px;
}

.badge{
  display:inline-block;
  border:1px solid #705b26;
  color:var(--gold2);
  background:rgba(216,180,90,.08);
  padding:11px 20px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  letter-spacing:1.4px;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(42px,8vw,78px);
  font-weight:950;
  letter-spacing:-3px;
  line-height:1;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  margin-top:22px;
  color:var(--sub);
  font-size:18px;
}

/* CARD */

.card{
  background:
    linear-gradient(145deg,rgba(255,255,255,.025),transparent),
    var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.section-title{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:22px;
  font-weight:850;
  margin-bottom:22px;
}

.number{
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--gold);
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
}

/* CREATE TYPE */

.create-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.option{
  border:1px solid #30343a;
  border-radius:20px;
  padding:24px;
  background:#0d0f12;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  border-color:#75602d;
  transform:translateY(-2px);
}

.option.active{
  border:2px solid var(--gold);
  background:rgba(216,180,90,.07);
}

.option-icon{
  font-size:30px;
  margin-bottom:12px;
}

.option-title{
  font-size:19px;
  font-weight:850;
}

.option-description{
  color:var(--sub);
  margin-top:7px;
  font-size:14px;
}

/* UPLOAD */

.upload-area{
  border:1px dashed #454a53;
  min-height:230px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  overflow:hidden;
  position:relative;
}

.upload-area:hover{
  border-color:var(--gold);
  background:rgba(216,180,90,.03);
}

.upload-content{
  padding:35px;
}

.upload-plus{
  font-size:58px;
  font-weight:200;
  line-height:1;
}

.upload-title{
  margin-top:15px;
  font-size:18px;
  font-weight:800;
}

.upload-sub{
  color:var(--sub);
  margin-top:7px;
}

.preview{
  width:100%;
  max-height:420px;
  object-fit:contain;
  display:none;
}

input[type=file]{
  display:none;
}

/* INPUT */

textarea,
.text-input{
  width:100%;
  background:#0b0c0f;
  color:white;
  border:1px solid #30343a;
  border-radius:16px;
  padding:17px;
  font-size:16px;
  outline:none;
  resize:vertical;
}

textarea{
  min-height:130px;
}

textarea:focus,
.text-input:focus{
  border-color:var(--gold);
}

.field-label{
  font-size:15px;
  font-weight:750;
  margin-bottom:10px;
}

/* STYLES */

.styles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.style{
  padding:18px 12px;
  text-align:center;
  border:1px solid #30343a;
  border-radius:15px;
  cursor:pointer;
  background:#0d0f12;
  font-weight:750;
}

.style.active{
  border-color:var(--gold);
  background:rgba(216,180,90,.08);
  color:var(--gold2);
}

/* COLOR */

.colors{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
}

.color{
  width:45px;
  height:45px;
  border-radius:50%;
  border:3px solid transparent;
  cursor:pointer;
}

.color.active{
  border-color:white;
  box-shadow:0 0 0 2px var(--gold);
}

.black{background:#080808}
.blue{background:#2878ff}
.red{background:#e52b35}
.purple{background:#873dff}
.gold{background:#d8b45a}
.white{background:#eee}

/* NAME */

.player{
  margin-top:22px;
}

/* BUTTON */

.generate{
  width:100%;
  border:0;
  border-radius:18px;
  padding:21px;
  background:linear-gradient(135deg,#e5c566,#c89f3f);
  color:#111;
  font-size:19px;
  font-weight:950;
  cursor:pointer;
  box-shadow:0 12px 35px rgba(216,180,90,.15);
  transition:.2s;
}

.generate:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.generate:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* RESULT */

.result{
  display:none;
  text-align:center;
}

.result img{
  width:100%;
  max-width:600px;
  border-radius:22px;
  border:1px solid #30343a;
}

.download{
  display:inline-block;
  margin-top:18px;
  padding:15px 24px;
  background:white;
  color:#111;
  border-radius:13px;
  font-weight:850;
  text-decoration:none;
}

/* MOBILE */

@media(max-width:650px){

  .container{
    width:94%;
  }

  header{
    height:70px;
  }

  .logo{
    font-size:21px;
  }

  .language select{
    padding:11px 35px 11px 12px;
    font-size:13px;
  }

  .hero{
    padding:50px 10px 35px;
  }

  .hero h1{
    font-size:46px;
  }

  .hero p{
    font-size:15px;
  }

  .card{
    padding:20px;
    border-radius:20px;
  }

  .create-options{
    grid-template-columns:1fr;
  }

  .styles{
    grid-template-columns:1fr 1fr;
  }

  .section-title{
    font-size:19px;
  }
}
</style>
</head>

<!-- 04 -->

<div class="card">

  </div>

      ⚔️ <span data-i18n="anime">アニメ</span>
    </div>

    <div class="style" data-style="dark">
      🌑 <span data-i18n="dark">ダーク</span>
    </div>

    <div class="style" data-style="cyber">
      🤖 <span data-i18n="cyber">サイバー</span>
    </div>

    <div class="style" data-style="battle">
      🔥 <span data-i18n="battle">バトル</span>
    </div>

    <div class="style" data-style="fantasy">
      🐉 <span data-i18n="fantasy">ファンタジー</span>
    </div>

    <div class="style" data-style="cute">
      ✨ <span data-i18n="cute">かわいい</span>
    </div>

  </div>

</div>


<!-- 05 -->

<div class="card">

  <div class="section-title">

    <div class="number">05</div>

    <span data-i18n="color">
      メインカラー
    </span>

  </div>

  <div class="colors">

    <div class="color black active" data-color="black"></div>
    <div class="color blue" data-color="blue"></div>
    <div class="color red" data-color="red"></div>
    <div class="color purple" data-color="purple"></div>
    <div class="color gold" data-color="gold"></div>
    <div class="color white" data-color="white"></div>

  </div>

</div>


<!-- GENERATE -->

<div class="card">

  <button
    class="generate"
    id="generate"
    data-i18n="generate"
  >
    ✨ AIでアイコンを生成する
  </button>

</div>


<!-- RESULT -->

<div class="card result" id="result">

  <div class="section-title">
    <div class="number">✓</div>
    <span data-i18n="result">
      完成したアイコン

  <a
    id="download"
    class="download"
    download="game-icon.png"
    data-i18n="download"

    画像を保存
  </a>

</div>

</div>

/* =========================
   LANGUAGE CHANGE
========================= */

const language = document.getElementById("language");

function translate(lang){

  const data = translations[lang];

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.dataset.i18n;

    if(data[key]){
      el.textContent = data[key];
    }

  });

  document.querySelectorAll("[data-placeholder]").forEach(el=>{

    const key = el.dataset.placeholder;

    if(data[key]){
      el.placeholder = data[key];
    }

  });

}

language.addEventListener("change",()=>{

  translate(language.value);

});


/* =========================
   CREATE MODE
========================= */

let createMode = "image";

document.querySelectorAll(".option").forEach(option=>{

  option.addEventListener("click",()=>{

    document.querySelectorAll(".option")
      .forEach(x=>x.classList.remove("active"));

    option.classList.add("active");

    createMode = option.dataset.mode;

    const uploadCard =
      document.getElementById("uploadCard");

    if(createMode === "image"){

      uploadCard.style.display = "block";

    }else{

      uploadCard.style.display = "none";

    }

  });

});


/* =========================
   IMAGE UPLOAD
========================= */

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const uploadContent =
  document.getElementById("uploadContent");

let uploadedImage = null;

imageInput.addEventListener("change",()=>{

  const file = imageInput.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e=>{

    uploadedImage = e.target.result;

    preview.src = uploadedImage;

    preview.style.display = "block";

    uploadContent.style.display = "none";

  };

  reader.readAsDataURL(file);

});


/* =========================
   STYLE
========================= */

let selectedStyle = "anime";

document.querySelectorAll(".style").forEach(el=>{

  el.addEventListener("click",()=>{

    document.querySelectorAll(".style")
      .forEach(x=>x.classList.remove("active"));

    el.classList.add("active");

    selectedStyle = el.dataset.style;

  });

});


/* =========================
   COLOR
========================= */

let selectedColor = "black";

document.querySelectorAll(".color").forEach(el=>{

  el.addEventListener("click",()=>{

    document.querySelectorAll(".color")
      .forEach(x=>x.classList.remove("active"));

    el.classList.add("active");

    selectedColor = el.dataset.color;

  });

});


/* =========================
   GENERATE
========================= */

const generateButton =
  document.getElementById("generate");

generateButton.addEventListener("click",async()=>{

  const prompt =
    document.getElementById("prompt").value.trim();

  const playerName =
    document.getElementById("playerName").value.trim();

  if(!prompt){

    alert(
      translations[language.value].ideaLabel
    );

    return;

  }

  generateButton.disabled = true;

  const originalText =
    translations[language.value].generate;

  generateButton.textContent =
    "✨ Generating...";

  try{

    const response = await fetch("/api/generate",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        mode:createMode,

        prompt:prompt,

        playerName:playerName,

        style:selectedStyle,

        color:selectedColor,

        image:uploadedImage

      })

    });

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Generation failed"
      );

    }

    const result =
      document.getElementById("result");

    const resultImage =
      document.getElementById("resultImage");

    const download =
      document.getElementById("download");

    resultImage.src = data.image;

    download.href = data.image;

    result.style.display = "block";

    result.scrollIntoView({
      behavior:"smooth"
    });

  }catch(error){

    alert(error.message);

  }finally{

    generateButton.disabled = false;

    generateButton.textContent =
      originalText;

  }

});

translate("ja");

</script>
