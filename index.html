<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Iconia AI</title>
<style>
:root{color-scheme:dark;--bg:#08090e;--panel:#12141c;--panel2:#181b25;--line:#2b3040;--text:#f5f7fb;--muted:#9198aa;--accent:#7657ff;--cyan:#09c9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 500px at 50% -200px,#241b55 0,#08090e 58%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}button,textarea,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh}.header{position:sticky;top:0;z-index:40;height:70px;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:#08090eec;backdrop-filter:blur(24px);border-bottom:1px solid #ffffff0d}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7657ff,#09c9ff);box-shadow:0 8px 30px #4e3bca55;font-size:23px}.brand b{font-size:18px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.actions{display:flex;gap:7px}.headBtn{background:#151822;border:1px solid var(--line);border-radius:13px;padding:9px 12px;font-weight:750;font-size:12px}.layout{display:flex;max-width:1180px;margin:auto}.side{width:250px;position:fixed;top:70px;bottom:0;padding:18px 12px;background:#0b0c12;border-right:1px solid #ffffff09;display:none}.side button{width:100%;text-align:left;background:transparent;padding:12px;border-radius:12px;color:#dfe3ee}.side button:hover{background:#171a24}.sideTitle{color:#737b8e;font-size:11px;padding:12px}.main{width:100%;max-width:920px;margin:auto;padding:0 12px 210px}.welcome{text-align:center;padding:64px 10px 32px}.bigLogo{width:82px;height:82px;margin:auto;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#7657ff,#09c9ff);font-size:38px;box-shadow:0 20px 70px #5141d044}.welcome h1{font-size:32px;letter-spacing:-1px;margin:20px 0 10px}.welcome p{color:var(--muted);max-width:650px;margin:auto;line-height:1.8}.chips{display:grid;gap:10px;max-width:700px;margin:28px auto}.chip{padding:15px 16px;text-align:left;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#131620,#10121a);line-height:1.5}.chip:hover{background:#191c27}.row{display:flex;margin:20px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(92%,780px);padding:13px 15px;border-radius:22px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#694cff,#5541df);border-bottom-right-radius:7px}.ai .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:7px;box-shadow:0 10px 40px #0003}.bubble img.result{display:block;width:min(680px,100%);margin-top:12px;border-radius:17px;background:#05060a;cursor:zoom-in}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool{background:#242938;border:1px solid #34394b;padding:8px 11px;border-radius:10px;font-size:11px}.ref{display:flex;align-items:center;gap:9px;margin-top:10px;padding:7px;background:#0004;border-radius:12px;color:#9da4b5}.ref img{width:58px;height:58px;object-fit:cover;border-radius:9px}.loading{display:flex;gap:9px;align-items:center;color:#aab0c1}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#846eff;animation:p 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}.error{background:#32171b!important;border-color:#6b2931!important;color:#ffb9b9}.error .tool{background:#57262d}.composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 72%,transparent)}.composer{max-width:920px;margin:auto;background:#151821;border:1px solid #303648;border-radius:24px;box-shadow:0 18px 60px #000b;overflow:hidden}.attachRow{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.attachRow.show{display:flex}.attachRow img{width:62px;height:62px;object-fit:cover;border-radius:10px}.attachInfo{flex:1}.attachInfo b{font-size:12px}.attachInfo small{display:block;color:var(--muted);margin-top:3px}.remove{width:34px;height:34px;border-radius:50%;background:#282d3c;font-size:20px}.inputRow{display:flex;align-items:flex-end;gap:8px;padding:9px}.iconBtn,.send{width:48px;height:48px;border-radius:15px;background:#272c3b;flex:none;font-size:24px}.send{background:linear-gradient(135deg,#7657ff,#09c9ff);box-shadow:0 8px 25px #385ee755}.send:disabled{opacity:.3;box-shadow:none}.text{flex:1;min-height:48px;max-height:190px;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:12px 3px;line-height:1.55}.text::placeholder{color:#737b8f}.hint{text-align:center;color:#6d7487;font-size:10px;padding:0 12px 10px}.drawer,.lightbox{position:fixed;inset:0;z-index:100;background:#000c;display:none}.drawer.show,.lightbox.show{display:block}.drawerBox{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);width:min(430px,calc(100% - 20px));max-height:85vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:22px;padding:15px}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#282d3c;font-size:20px}.history{display:grid;gap:8px;margin-top:12px}.historyItem{background:#191c26;border:1px solid var(--line);border-radius:13px;padding:11px}.historyItem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem small{display:block;color:var(--muted);margin-top:4px}.lightbox img{max-width:94vw;max-height:88vh;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px}.lightClose{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);width:44px;height:44px;border-radius:50%;background:#242837;font-size:24px}@media(min-width:900px){.side{display:block}.main{margin-left:250px;width:calc(100% - 250px)}.header{padding-left:calc(max(16px,(100vw - 1180px)/2 + 266px));padding-right:max(16px,(100vw - 1180px)/2)}}@media(max-width:600px){.header{height:64px}.brand b{font-size:17px}.headBtn{padding:8px 9px}.welcome{padding-top:40px}.welcome h1{font-size:26px}.bubble{max-width:95%}.main{padding-left:8px;padding-right:8px}.hint{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">✦</div><div><b>Iconia AI</b><span>話すだけで、画像をつくる</span></div></div><div class="actions"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div></header>
<div class="layout"><aside class="side"><button id="sideNew">＋ 新しい会話</button><div class="sideTitle">ICONIA AI</div><button id="sideHistory">最近の会話</button><button id="clearBtn">会話をリセット</button></aside><main class="main" id="main"></main></div>
<div class="composerWrap"><div class="composer"><div class="attachRow" id="attachRow"><img id="attachPreview" alt="参考画像"><div class="attachInfo"><b>参考画像</b><small>この画像を元に編集します</small></div><button class="remove" id="remove">×</button></div><div class="inputRow"><button class="iconBtn" id="attachBtn" aria-label="画像を追加">＋</button><textarea id="text" class="text" rows="1" placeholder="作りたい画像を自由に説明してください…"></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint">Enter＝改行　／　⌘+Enter・Ctrl+Enter＝送信　／　画像あり＝編集</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="drawerBox"><div class="drawerHead"><b>会話履歴</b><button class="close" id="close">×</button></div><div class="history" id="history"></div></div></div>
<div class="lightbox" id="lightbox"><button class="lightClose" id="lightClose">×</button><img id="lightImg" alt="拡大画像"></div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const KEY="iconia_pro_v2";
let state=load(),pending=null,busy=false,retryRequest=null;
const $=id=>document.getElementById(id);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x||{messages:[],lastImage:null}}catch{return{messages:[],lastImage:null}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-40),lastImage:state.lastImage}))}catch{try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-15),lastImage:null}))}catch{}}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function isNew(t){return /^(新しく|新規|別の|もう一枚|もう1枚|違う画像|別バージョン|新しい|新たに|ゼロから|最初から)/.test(t.trim())}
function shouldReuse(t){return !!state.lastImage&&!isNew(t)&&/さっき|前の|この画像|このキャラ|これ|そのまま|もう少し|もっと|少し|背景|髪|顔|服|目|文字|テキスト|ロゴ|ポーズ|構図|明る|暗|色|大き|小さ|右|左|上|下|消して|追加|変更|修正|直して|編集|タッチ|絵柄|画風|同じ/.test(t)}
function isUndo(t){return /^(戻して|元に戻して|前の状態に戻して|一つ前に戻して|ひとつ前に戻して|取り消して|直前に戻して|前に戻して|undo)$/i.test(String(t||"").trim())}
function isRemoveLastText(t){return /(文字|テキスト|ロゴ|名前).*(消して|削除|取り除いて)|(?:その|追加した|入れた).*(文字|テキスト|ロゴ).*(消して|削除|取り除いて)/.test(String(t||"").trim())}
function uniqueImages(){const out=[];for(let i=state.messages.length-1;i>=0;i--){const im=state.messages[i]?.image;if(im&&out[out.length-1]!==im&&!out.includes(im))out.push(im)}return out}
function canRevert(t){if(!state.messages.some(x=>x.image))return false;const u=uniqueImages();if(u.length<2)return false;if(isUndo(t))return true;const lastUser=[...state.messages].reverse().find(x=>x.role==='user');return isRemoveLastText(t)&&lastUser&&/(文字|テキスト|ロゴ|名前).*(入れ|追加|書いて|載せ|付け)/.test(lastUser.text)}
function revertOne(message){const u=uniqueImages();if(u.length<2)return false;const current=u[0],previous=u[1];state.lastImage=previous;state.messages.push({role:'user',text:message,ref:current});state.messages.push({role:'ai',text:'元に戻しました。直前の画像をそのまま復元しました。',image:previous});save();render();resize();return true}
function welcome(){return `<section class="welcome"><div class="bigLogo">✦</div><h1>自分だけの画像を、話すだけで。</h1><p>普通に話してください。参考画像を貼れば、その画像を理解して、必要な部分だけを編集します。</p><div class="chips"><button class="chip">💡 クールなゲームアイコンを作って。黒髪、黒い服、青い光。最高品質で。</button><button class="chip">💡 この画像の人物はそのまま。絵柄だけをプレミアムなゲームイラスト風に変えて。</button><button class="chip">💡 このキャラのまま、背景だけ夜の東京に変更して。人物は一切変えないで。</button></div></section>`}
function render(){const m=$("main");if(!state.messages.length){m.innerHTML=welcome();m.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("text").value=b.textContent.replace(/^💡\s*/,"");resize();$("text").focus()});return}m.innerHTML=state.messages.map((x,i)=>{let html=`<div class="row ${x.role}"><div class="bubble"><div>${esc(x.text)}</div>`;if(x.ref)html+=`<div class="ref"><img src="${x.ref}" alt=""><span>参考画像</span></div>`;if(x.image)html+=`<img class="result" src="${x.image}" data-image-index="${i}" alt="生成画像"><div class="tools"><button class="tool" data-act="save" data-i="${i}">画像を保存</button><button class="tool" data-act="copy" data-i="${i}">説明をコピー</button><button class="tool" data-act="edit" data-i="${i}">この画像を編集</button></div>`;html+=`</div></div>`;return html}).join("");m.querySelectorAll(".result").forEach(img=>img.onclick=()=>{$("lightImg").src=img.src;$('lightbox').classList.add('show')});m.querySelectorAll('[data-act="save"]').forEach(b=>b.onclick=()=>{const x=state.messages[+b.dataset.i];const a=document.createElement('a');a.href=x.image;a.download=`iconia-ai-${Date.now()}.jpg`;a.click()});m.querySelectorAll('[data-act="copy"]').forEach(b=>b.onclick=async()=>{await navigator.clipboard?.writeText(state.messages[+b.dataset.i].text);b.textContent="コピーしました";setTimeout(()=>b.textContent="説明をコピー",1000)});m.querySelectorAll('[data-act="edit"]').forEach(b=>b.onclick=()=>{state.lastImage=state.messages[+b.dataset.i].image;save();$("text").focus()});if(busy)m.insertAdjacentHTML('beforeend','<div class="row ai"><div class="bubble"><div class="loading">最高品質で処理しています… <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div></div></div>');if(retryRequest&&!busy)m.insertAdjacentHTML('beforeend',`<div class="row ai"><div class="bubble error"><div>うまく処理できませんでした。</div><div>${esc(retryRequest.error||"もう一度試してください")}</div><div class="tools"><button class="tool" id="retry">もう一度</button></div></div></div>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});if($('retry'))$('retry').onclick=()=>{const q=retryRequest;retryRequest=null;send(q.message,q.image,true)}}
function resize(){const t=$("text");t.style.height='auto';t.style.height=Math.min(Math.max(t.scrollHeight,48),190)+'px';$("send").disabled=!t.value.trim()||busy}
async function compress(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.9))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function setPending(img){pending=img;$("attachPreview").src=img;$("attachRow").classList.add('show')}
function clearPending(){pending=null;$("attachRow").classList.remove('show');$("file").value=''}
async function send(message,forcedImage=null,isRetry=false){message=String(message||"").trim();if(!message||busy)return;if(!forcedImage&&!pending&&canRevert(message)){revertOne(message);return}const image=forcedImage||(pending?pending:(shouldReuse(message)?state.lastImage:null));retryRequest=null;state.messages.push({role:'user',text:message,ref:image||null});save();clearPending();busy=true;render();resize();try{const history=state.messages.slice(-22).map(x=>({role:x.role,text:x.text}));const r=await fetch('/api/generate.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,image,history})});let data={};try{data=await r.json()}catch{}if(!r.ok||!data.success)throw new Error(data.error||`処理に失敗しました (${r.status})`);state.messages.push({role:'ai',text:data.reply||'できました。',image:data.image||null});if(data.image)state.lastImage=data.image;save();}catch(e){retryRequest={message,image,error:e.message};}finally{busy=false;render();resize();}}
$("text").addEventListener('input',resize);$("text").addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();const v=$("text").value;$("text").value='';resize();send(v)}});$("send").onclick=()=>{const v=$("text").value;$("text").value='';resize();send(v)};$("attachBtn").onclick=()=>$("file").click();$("file").onchange=async e=>{const f=e.target.files?.[0];if(f){try{setPending(await compress(f))}catch{alert('画像を読み込めませんでした')}}};$("remove").onclick=clearPending;$("newBtn").onclick=$("sideNew").onclick=()=>{state={messages:[],lastImage:null};save();clearPending();render()};$("historyBtn").onclick=$("sideHistory").onclick=()=>{$("history").innerHTML=state.messages.length?`<div class="historyItem"><b>${esc(state.messages.find(x=>x.role==='user')?.text||'会話')}</b><small>${state.messages.length} メッセージ</small></div>`:'<div class="historyItem">履歴はありません</div>';$('drawer').classList.add('show')};$("clearBtn").onclick=()=>{state={messages:[],lastImage:null};save();render()};$("close").onclick=()=>$("drawer").classList.remove('show');$("drawer").onclick=e=>{if(e.target===$("drawer"))$("drawer").classList.remove('show')};$("lightClose").onclick=()=>$("lightbox").classList.remove('show');$("lightbox").onclick=e=>{if(e.target===$("lightbox"))$("lightbox").classList.remove('show')};document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item){const f=item.getAsFile();if(f)compress(f).then(setPending)}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/'));if(f)setPending(await compress(f))});render();resize();
</script>
</body>
</html>
