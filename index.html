<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<title>Game Icon AI</title>
<style>
:root{
  --bg:#080910;
  --panel:#11131d;
  --panel2:#171a26;
  --line:#2a2d3d;
  --text:#f7f8ff;
  --muted:#9ea3b8;
  --accent:#7657ff;
  --accent2:#22c8ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","Hiragino Kaku Gothic ProN",Meiryo,sans-serif
}
body{min-height:100vh}
button,textarea{font:inherit}
button{
  color:inherit;
  border:0;
  cursor:pointer
}
.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:145px
}
header{
  position:sticky;
  top:0;
  z-index:30;
  padding:12px 14px calc(10px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(8,9,16,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}
.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7958ff,#16c9ff);
  font-size:22px;
  box-shadow:0 8px 28px #6f55ff33;
  flex:0 0 auto
}
.brand strong{
  font-size:19px;
  display:block;
  white-space:nowrap
}
.brand small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px
}
.reset{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  font-weight:800;
  white-space:nowrap
}
main{padding:18px 14px}
.hero{padding:7px 3px 18px}
.hero h1{
  margin:0 0 8px;
  font-size:30px;
  line-height:1.18;
  background:linear-gradient(90deg,#fff,#a68aff,#55d5ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}
.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.65;
  font-size:14px
}
.chat{
  display:flex;
  flex-direction:column;
  gap:16px
}
.msg{
  display:flex;
  gap:9px;
  align-items:flex-start
}
.msg.user{justify-content:flex-end}
.avatar{
  width:30px;
  height:30px;
  border-radius:10px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7958ff,#16c9ff);
  font-size:14px
}
.user .avatar{display:none}
.bubble{
  max-width:91%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word
}
.assistant .bubble{
  background:var(--panel);
  border:1px solid var(--line);
  border-top-left-radius:7px
}
.user .bubble{
  background:linear-gradient(135deg,#6f50f5,#5a42d5);
  border-bottom-right-radius:6px
}
.attach-in-chat{
  margin-top:9px;
  border:1px solid #393c51;
  border-radius:13px;
  padding:7px;
  background:#0b0c13;
  display:flex;
  align-items:center;
  gap:9px
}
.attach-in-chat img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:9px
}
.examples{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:11px
}
.example{
  text-align:left;
  background:#1a1d2a;
  border:1px solid #34384d;
  border-radius:13px;
  padding:10px 12px;
  color:#e3e5f1;
  line-height:1.45
}
.example:active{transform:scale(.99)}
.image-card{
  margin-top:10px;
  background:#0a0b11;
  border:1px solid var(--line);
  border-radius:18px;
  padding:8px
}
.image-card img{
  width:100%;
  display:block;
  border-radius:13px;
  background:#10111a
}
.image-actions{
  display:flex;
  gap:8px;
  margin-top:8px
}
.image-actions a,
.image-actions button{
  flex:1;
  background:#1a1d2a;
  border:1px solid #34384d;
  border-radius:12px;
  padding:10px;
  text-align:center;
  text-decoration:none;
  font-weight:800
}
.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent 0,#080910 27%)
}
.composer{
  max-width:760px;
  margin:auto;
  background:rgba(20,22,33,.97);
  border:1px solid #363a4f;
  border-radius:22px;
  padding:9px;
  box-shadow:0 14px 44px #000b
}
.preview{
  display:none;
  align-items:center;
  gap:9px;
  padding:2px 2px 8px
}
.preview.show{display:flex}
.preview img{
  width:52px;
  height:52px;
  object-fit:cover;
  border-radius:10px
}
.preview span{
  font-size:12px;
  color:var(--muted);
  flex:1
}
.preview button{
  background:#292c3d;
  border-radius:10px;
  padding:7px 10px
}
textarea{
  width:100%;
  min-height:48px;
  max-height:155px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  padding:7px 8px;
  line-height:1.5
}
.bottom{
  display:flex;
  align-items:center;
  gap:8px
}
.iconbtn{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#202331;
  border:1px solid #303448;
  display:grid;
  place-items:center;
  font-size:23px
}
.send{
  margin-left:auto;
  width:43px;
  height:43px;
  border-radius:14px;
  background:linear-gradient(135deg,#7958ff,#20c8ff);
  font-weight:900;
  font-size:20px
}
.send:disabled{
  opacity:.45;
  cursor:default
}
.status{
  font-size:11px;
  color:#969aae;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.hint{
  text-align:center;
  color:#777b90;
  font-size:10px;
  margin-top:6px
}
.typing{
  display:inline-flex;
  gap:4px
}
.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#aab0c5;
  animation:dot 1s infinite
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{
  50%{
    opacity:.25;
    transform:translateY(-2px)
  }
}
@media(min-width:760px){
  main{padding:26px 20px}
  .hero h1{font-size:36px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <strong>Game Icon AI</strong>
      <small>会話するだけで、理想のゲームアイコンへ</small>
    </div>
  </div>

  <button class="reset" id="reset">
    新しい会話
  </button>
</header>

<main>

<section class="hero">
  <h1>理想を、そのまま話してください。</h1>

  <p>
    画像がなくてもオリジナルキャラクターを作れます。
    画像を送れば、その画像をベースに編集できます。
    細かい設定項目はありません。
  </p>
</section>

<section class="chat" id="chat"></section>

</main>
</div>

<div class="composer-wrap">

<div class="composer">

<div class="preview" id="preview">

<img id="previewImg" alt="参考画像">

<span>参考画像を添付中</span>

<button id="removeImage" type="button">
×
</button>

</div>

<textarea
id="prompt"
rows="1"
placeholder="例：「完全オリジナルのキャラ。黒髪の男性、冷酷で強そう。青い炎、夜の東京、人物を大きく」">
</textarea>

<div class="bottom">

<button
class="iconbtn"
id="uploadBtn"
type="button"
title="画像を追加">
＋
</button>

<input
id="fileInput"
type="file"
accept="image/png,image/jpeg,image/webp"
hidden>

<span class="status" id="status"></span>

<button
class="send"
id="send"
type="button">
↑
</button>

</div>

<div class="hint">
画像なし＝オリジナル作成　／　画像あり＝その画像をベースに編集
</div>

</div>
</div>

<script>

const chat = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("send");

const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");

const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

const removeImage = document.getElementById("removeImage");
const resetBtn = document.getElementById("reset");

const statusEl = document.getElementById("status");

let imageData = null;
let previousResponseId = null;
let busy = false;

const examples = [

"完全オリジナルの男性キャラクター。冷酷で強そう。黒い服、青い炎、夜の東京。人物を大きくして、ゲームアイコンらしい迫力のある構図にして。",

"完全オリジナルの女性キャラクター。美しくて強い雰囲気。黒と赤を基調にして、月夜の背景。顔を綺麗に見せてゲームアイコン向けに。",

"まだイメージが決まっていない。ゲームで使いたくなるカッコいいオリジナルキャラクターを3案考えて、その中から1つ作って。"

];

function addMessage(role,text,extra={}){

const row=document.createElement("div");

row.className="msg "+role;

const avatar=document.createElement("div");

avatar.className="avatar";

avatar.textContent=role==="assistant"?"✦":"";

const bubble=document.createElement("div");

bubble.className="bubble";

if(extra.typing){

bubble.innerHTML=
'<span class="typing"><i></i><i></i><i></i></span>';

}else if(text){

bubble.textContent=text;

}

if(extra.inputImage){

const wrap=document.createElement("div");

wrap.className="attach-in-chat";

const img=document.createElement("img");

img.src=extra.inputImage;

img.alt="添付画像";

const label=document.createElement("span");

label.textContent="参考画像";

wrap.append(img,label);

bubble.appendChild(wrap);

}

if(extra.image){

const card=document.createElement("div");

card.className="image-card";

const img=document.createElement("img");

img.src=extra.image;

img.alt="生成されたゲームアイコン";

const actions=document.createElement("div");

actions.className="image-actions";

const save=document.createElement("a");

save.href=extra.image;

save.download="game-icon-ai.png";

save.textContent="↓ 保存";

const edit=document.createElement("button");

edit.type="button";

edit.textContent="この画像を続けて編集";

edit.onclick=()=>{

imageData=extra.image;

showPreview();

promptEl.focus();

};

actions.append(save,edit);

card.append(img,actions);

bubble.appendChild(card);

}

if(Array.isArray(extra.examples) && extra.examples.length){

const box=document.createElement("div");

box.className="examples";

extra.examples.slice(0,3).forEach(value=>{

const b=document.createElement("button");

b.type="button";

b.className="example";

b.textContent="💡 "+value;

b.onclick=()=>{

promptEl.value=value;

autoSize();

promptEl.focus();

};

box.appendChild(b);

});

bubble.appendChild(box);

}

row.append(avatar,bubble);

chat.appendChild(row);

row.scrollIntoView({
behavior:"smooth",
block:"end"
});

return row;

}

function welcome(){

addMessage(
"assistant",

`こんにちは。Game Icon AIです。

ここでは細かい設定を選ぶ必要はありません。
作りたいものを、ChatGPTに話しかけるように普通の言葉で伝えてください。

画像がなくてもオリジナルキャラクターを作れます。
画像を送れば、その画像をベースに「人物はそのまま」「背景だけ変更」「もっと明るく」などの編集もできます。

まだイメージが決まっていなくても大丈夫です。
「何かカッコいいキャラを作って」だけでも、こちらから具体的な案を出します。

例えば👇`,

{examples}
);

}

function showPreview(){

if(imageData){

previewImg.src=imageData;

preview.classList.add("show");

}else{

preview.classList.remove("show");

previewImg.removeAttribute("src");

}

}

function autoSize(){

promptEl.style.height="auto";

promptEl.style.height=
Math.min(promptEl.scrollHeight,155)+"px";

}

function setBusy(v){

busy=v;

sendBtn.disabled=v;

statusEl.textContent=
v?"AIが考えています…":"";

}

async function compressImage(file){

const src=await new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);

reader.onerror=reject;

reader.readAsDataURL(file);

});

const img=await new Promise((resolve,reject)=>{

const el=new Image();

el.onload=()=>resolve(el);

el.onerror=reject;

el.src=src;

});

const maxSide=1200;

const scale=Math.min(
1,
maxSide/Math.max(img.width,img.height)
);

const canvas=document.createElement("canvas");

canvas.width=
Math.max(1,Math.round(img.width*scale));

canvas.height=
Math.max(1,Math.round(img.height*scale));

canvas
.getContext("2d")
.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

return canvas.toDataURL(
"image/jpeg",
0.82
);

}

async function send(){

if(busy)return;

const text=promptEl.value.trim();

if(!text && !imageData)return;

addMessage(
"user",
text || "この画像をベースに編集してください。",
{
inputImage:imageData || null
}
);

promptEl.value="";

autoSize();

setBusy(true);

const typing=
addMessage(
"assistant",
"",
{typing:true}
);

try{

const response=await fetch(
"/api/generate",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:
text ||
"この画像をベースにしてください。まず画像を見て、より良くするために必要なことを判断してください。",

image:imageData,

previousResponseId

})
}
);

const data=await response.json();

typing.remove();

if(!response.ok){

throw new Error(
data.error ||
"生成に失敗しました。"
);

}

previousResponseId=
data.responseId ||
previousResponseId;

if(data.image){

imageData=data.image;

showPreview();

addMessage(
"assistant",
data.reply ||
"できました。ここからさらに修正できます。",
{
image:data.image,
examples:data.examples || []
}
);

}else{

addMessage(
"assistant",
data.reply ||
"もちろん。もう少し希望を教えてください。",
{
examples:data.examples || []
}
);

}

}catch(error){

typing.remove();

addMessage(
"assistant",
"うまく処理できませんでした。\n\n"+
(error.message || "不明なエラーです。")
);

}finally{

setBusy(false);

}

}

uploadBtn.addEventListener(
"click",
()=>fileInput.click()
);

fileInput.addEventListener(
"change",
async()=>{

const file=
fileInput.files &&
fileInput.files[0];

if(!file)return;

try{

imageData=
await compressImage(file);

showPreview();

statusEl.textContent=
"画像を添付しました";

setTimeout(()=>{
if(!busy)
statusEl.textContent="";
},1400);

}catch{

statusEl.textContent=
"画像を読み込めませんでした";

}

}
);

removeImage.addEventListener(
"click",
()=>{

imageData=null;

fileInput.value="";

showPreview();

}
);

promptEl.addEventListener(
"input",
autoSize
);

promptEl.addEventListener(
"keydown",
e=>{

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

send();

}

}
);

document.addEventListener(
"paste",
async e=>{

const items=
Array.from(
e.clipboardData?.items || []
);

const imageItem=
items.find(
item=>item.type.startsWith("image/")
);

if(!imageItem)return;

const file=
imageItem.getAsFile();

if(!file)return;

e.preventDefault();

try{

imageData=
await compressImage(file);

showPreview();

statusEl.textContent=
"貼り付けた画像を添付しました";

setTimeout(()=>{
if(!busy)
statusEl.textContent="";
},1500);

}catch{

statusEl.textContent=
"画像を読み込めませんでした";

}

}
);

sendBtn.addEventListener(
"click",
send
);

resetBtn.addEventListener(
"click",
()=>{

previousResponseId=null;

imageData=null;

fileInput.value="";

promptEl.value="";

autoSize();

showPreview();

chat.innerHTML="";

welcome();

}
);

welcome();

</script>

</body>
</html>
