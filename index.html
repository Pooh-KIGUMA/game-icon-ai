<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#080910">

<title>Iconia AI</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #080910;
  color: #f5f5f7;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body {
  min-height: 100vh;
}

button,
textarea,
input {
  font: inherit;
}

button {
  border: 0;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  position: sticky;
  top: 0;
  z-index: 50;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    16px
    12px;

  background: rgba(8,9,16,.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid rgba(255,255,255,.08);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 46px;
  height: 46px;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  background:
    linear-gradient(
      135deg,
      #6954ff,
      #0ccfff
    );

  box-shadow:
    0 8px 25px rgba(79,70,229,.28);
}

.brandText strong {
  display: block;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.brandText span {
  display: block;
  margin-top: 2px;

  color: #8f94a5;
  font-size: 12px;
}

.headerButtons {
  display: flex;
  gap: 8px;
}

.headerButton {
  height: 44px;

  padding: 0 14px;

  border-radius: 14px;

  background: #171923;
  color: #f5f5f7;

  border: 1px solid #2a2e3c;

  font-weight: 700;
}

.headerButton:active {
  transform: scale(.97);
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;

  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  padding:
    18px
    14px
    170px;
}

.welcome {
  padding: 38px 14px 30px;
  text-align: center;
}

.welcomeIcon {
  width: 64px;
  height: 64px;

  margin: 0 auto 18px;

  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 34px;

  background:
    linear-gradient(
      135deg,
      #7155ff,
      #08c8ff
    );

  box-shadow:
    0 15px 45px rgba(70,70,255,.25);
}

.welcome h1 {
  margin: 0;

  font-size: 28px;
  line-height: 1.2;
}

.welcome p {
  margin: 12px auto 0;

  max-width: 520px;

  color: #969aaa;

  font-size: 14px;
  line-height: 1.8;
}

.exampleList {
  display: grid;
  gap: 10px;

  max-width: 600px;

  margin: 25px auto 0;
}

.example {
  padding: 14px 16px;

  border-radius: 16px;

  text-align: left;

  background: #12141d;

  border: 1px solid #292d3b;

  color: #d9dce5;

  cursor: pointer;
}

.example:active {
  transform: scale(.985);
  background: #191b27;
}

/* =========================
   MESSAGES
========================= */

.messageRow {
  display: flex;
  margin: 18px 0;
}

.messageRow.user {
  justify-content: flex-end;
}

.message {
  max-width: min(88%, 700px);

  padding: 13px 15px;

  border-radius: 20px;

  line-height: 1.65;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  background:
    linear-gradient(
      135deg,
      #674cff,
      #5142d8
    );

  border-bottom-right-radius: 6px;
}

.message.ai {
  background: #151822;
  border: 1px solid #272b39;
  border-bottom-left-radius: 6px;
}

.messageText {
  font-size: 15px;
}

.messageImage {
  display: block;

  width: min(100%, 500px);

  margin-top: 10px;

  border-radius: 14px;

  background: #090a10;
}

.reference {
  margin-top: 10px;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 8px;

  border-radius: 12px;

  background: rgba(0,0,0,.18);
}

.reference img {
  width: 58px;
  height: 58px;

  object-fit: cover;

  border-radius: 9px;
}

.reference span {
  color: #e2e4ea;
  font-size: 12px;
}

/* =========================
   LOADING
========================= */

.loading {
  display: flex;
  align-items: center;
  gap: 7px;

  padding: 14px 16px;

  color: #9ea3b4;
}

.dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #7a61ff;

  animation: bounce 1.1s infinite;
}

.dot:nth-child(2) {
  animation-delay: .15s;
}

.dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {

  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: .35;
  }

  30% {
    transform: translateY(-5px);
    opacity: 1;
  }

}

/* =========================
   INPUT
========================= */

.composerWrap {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 40;

  padding:
    10px
    12px
    calc(env(safe-area-inset-bottom) + 12px);

  background:
    linear-gradient(
      to top,
      #080910 72%,
      rgba(8,9,16,0)
    );
}

.composer {
  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  border-radius: 23px;

  background: #151722;

  border: 1px solid #303445;

  box-shadow:
    0 10px 45px rgba(0,0,0,.4);

  overflow: hidden;
}

.previewAttachment {
  display: none;

  padding: 10px 12px;

  border-bottom: 1px solid #292d39;
}

.previewAttachment.show {
  display: flex;
  align-items: center;
  gap: 10px;
}

.previewAttachment img {
  width: 58px;
  height: 58px;

  object-fit: cover;

  border-radius: 10px;
}

.previewInfo {
  flex: 1;

  min-width: 0;
}

.previewInfo strong {
  display: block;

  font-size: 13px;
}

.previewInfo span {
  display: block;

  margin-top: 3px;

  color: #898e9f;

  font-size: 11px;
}

.removeImage {
  width: 35px;
  height: 35px;

  border-radius: 50%;

  background: #242733;
  color: #fff;

  font-size: 18px;
}

.inputArea {
  display: flex;
  align-items: flex-end;

  gap: 8px;

  padding: 10px;
}

.attachButton {
  flex: 0 0 auto;

  width: 46px;
  height: 46px;

  border-radius: 15px;

  background: #252937;
  color: #fff;

  font-size: 25px;
}

textarea {
  flex: 1;

  min-height: 46px;
  max-height: 150px;

  resize: none;

  padding: 12px 4px;

  background: transparent;

  border: 0;
  outline: 0;

  color: #f5f5f7;

  line-height: 1.5;

  font-size: 15px;
}

textarea::placeholder {
  color: #767b8c;
}

.sendButton {
  flex: 0 0 auto;

  width: 46px;
  height: 46px;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #7355ff,
      #09c9ff
    );

  color: white;

  font-size: 22px;

  font-weight: 800;
}

.sendButton:disabled {
  opacity: .35;
}

.modeHint {
  padding:
    0 15px
    10px;

  color: #74798a;

  font-size: 11px;

  text-align: center;
}

/* =========================
   HISTORY
========================= */

.historyPanel {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  background: rgba(0,0,0,.72);

  backdrop-filter: blur(8px);
}

.historyPanel.show {
  display: block;
}

.historyBox {
  position: absolute;

  right: 10px;
  top: calc(env(safe-area-inset-top) + 10px);

  width: min(390px, calc(100% - 20px));

  max-height: 80vh;

  overflow-y: auto;

  padding: 16px;

  border-radius: 22px;

  background: #12141c;

  border: 1px solid #303444;
}

.historyHeader {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 12px;
}

.historyHeader strong {
  font-size: 18px;
}

.historyClose {
  width: 36px;
  height: 36px;

  border-radius: 50%;

  background: #242733;
  color: white;
}

.historyItem {
  padding: 13px;

  margin-top: 8px;

  border-radius: 14px;

  background: #1a1d27;

  border: 1px solid #292d39;

  cursor: pointer;
}

.historyItem strong {
  display: block;

  font-size: 13px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.historyItem span {
  display: block;

  margin-top: 4px;

  color: #7f8494;

  font-size: 11px;
}

/* =========================
   ERROR
========================= */

.error {
  padding: 13px 15px;

  color: #ffb5b5;

  background: #35191d;

  border: 1px solid #6d2a32;

  border-radius: 15px;

  line-height: 1.6;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .header {
    padding-left: 12px;
    padding-right: 12px;
  }

  .brandText strong {
    font-size: 18px;
  }

  .headerButton {
    padding: 0 11px;
    font-size: 13px;
  }

  .chat {
    padding-left: 10px;
    padding-right: 10px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .message {
    max-width: 91%;
  }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div class="logo">
      ✦
    </div>

    <div class="brandText">
      <strong>Iconia AI</strong>
      <span>話すだけで、画像をつくる</span>
    </div>

  </div>

  <div class="headerButtons">

    <button
      class="headerButton"
      id="historyButton"
    >
      履歴
    </button>

    <button
      class="headerButton"
      id="newChatButton"
    >
      新しい会話
    </button>

  </div>

</header>


<main
  class="chat"
  id="chat"
>

</main>


<div class="composerWrap">

  <div class="composer">

    <div
      class="previewAttachment"
      id="previewAttachment"
    >

      <img
        id="attachmentPreview"
        alt=""
      >

      <div class="previewInfo">

        <strong>参考画像</strong>

        <span>
          この画像を使って編集できます
        </span>

      </div>

      <button
        class="removeImage"
        id="removeImage"
      >
        ×
      </button>

    </div>


    <div class="inputArea">

      <button
        class="attachButton"
        id="attachButton"
        title="画像を追加"
      >
        ＋
      </button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="作りたい画像を自由に説明してください…"
      ></textarea>

      <button
        class="sendButton"
        id="sendButton"
      >
        ↑
      </button>

    </div>

    <div class="modeHint">
      画像なし＝オリジナル ／ 画像あり＝編集 ／ Enter＝送信
    </div>

  </div>

</div>


<input
  type="file"
  id="fileInput"
  accept="image/*"
  hidden
>


<div
  class="historyPanel"
  id="historyPanel"
>

  <div class="historyBox">

    <div class="historyHeader">

      <strong>
        会話履歴
      </strong>

      <button
        class="historyClose"
        id="historyClose"
      >
        ×
      </button>

    </div>

    <div id="historyList"></div>

  </div>

</div>


<script>

const STORAGE_KEY =
  "iconia-ai-conversations-v3";

const CURRENT_KEY =
  "iconia-ai-current-v3";

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const attachButton =
  document.getElementById("attachButton");

const fileInput =
  document.getElementById("fileInput");

const previewAttachment =
  document.getElementById("previewAttachment");

const attachmentPreview =
  document.getElementById("attachmentPreview");

const removeImage =
  document.getElementById("removeImage");

const historyButton =
  document.getElementById("historyButton");

const historyPanel =
  document.getElementById("historyPanel");

const historyClose =
  document.getElementById("historyClose");

const historyList =
  document.getElementById("historyList");

const newChatButton =
  document.getElementById("newChatButton");


let currentImage = null;

let generating = false;


/* =========================
   CONVERSATION
========================= */

function createConversation() {

  return {

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),

    title:
      "新しい会話",

    createdAt:
      Date.now(),

    updatedAt:
      Date.now(),

    messages: []

  };

}


function getConversations() {

  try {

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!raw) {
      return [];
    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveConversations(list) {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(list)
    );

  } catch (error) {

    console.error(
      "保存失敗",
      error
    );

  }

}


function loadCurrentConversation() {

  const conversations =
    getConversations();

  const currentId =
    localStorage.getItem(
      CURRENT_KEY
    );

  let conversation =
    conversations.find(
      item =>
        item.id === currentId
    );

  if (!conversation) {

    conversation =
      createConversation();

    conversations.unshift(
      conversation
    );

    saveConversations(
      conversations
    );

    localStorage.setItem(
      CURRENT_KEY,
      conversation.id
    );

  }

  return conversation;

}


let conversation =
  loadCurrentConversation();


function saveCurrent() {

  const conversations =
    getConversations();

  const index =
    conversations.findIndex(
      item =>
        item.id === conversation.id
    );

  conversation.updatedAt =
    Date.now();

  if (index >= 0) {

    conversations[index] =
      conversation;

  } else {

    conversations.unshift(
      conversation
    );

  }

  saveConversations(
    conversations
  );

  localStorage.setItem(
    CURRENT_KEY,
    conversation.id
  );

}


/* =========================
   WELCOME
========================= */

function showWelcome() {

  chat.innerHTML = `

    <section class="welcome">

      <div class="welcomeIcon">
        ✦
      </div>

      <h1>
        どんな画像を作りますか？
      </h1>

      <p>
        難しい設定は必要ありません。
        ChatGPTに話しかけるように、
        作りたい画像をそのまま説明してください。
      </p>

      <div class="exampleList">

        <button
          class="example"
          data-text="完全オリジナルのクールな男性キャラクターを作って。黒髪、黒い服、青い炎。ゲームアイコン向けに人物を大きくして。"
        >
          💡 完全オリジナルのキャラクターを作る
        </button>

        <button
          class="example"
          data-text="この画像をゲームアイコン用にして。人物を大きくして、背景は夜のネオン都市。高級感のある雰囲気で。"
        >
          🎮 ゲームアイコンを作る
        </button>

        <button
          class="example"
          data-text="Xのヘッダー画像を作って。夜の東京、青いネオン、クールで高級感のある雰囲気。"
        >
          🖼️ SNS用の画像を作る
        </button>

      </div>

    </section>

  `;

  document
    .querySelectorAll(".example")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          input.value =
            button.dataset.text;

          autoResize();

          input.focus();

        }
      );

    });

}


/* =========================
   RENDER
========================= */

function render() {

  chat.innerHTML = "";

  if (
    !conversation.messages.length
  ) {

    showWelcome();

    return;

  }

  conversation.messages
    .forEach(message => {

      renderMessage(
        message
      );

    });

  scrollBottom();

}


function renderMessage(message) {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "messageRow " +
    (
      message.role === "user"
        ? "user"
        : "ai"
    );

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message " +
    (
      message.role === "user"
        ? "user"
        : "ai"
    );

  if (
    message.text
  ) {

    const text =
      document.createElement(
        "div"
      );

    text.className =
      "messageText";

    text.textContent =
      message.text;

    box.appendChild(
      text
    );

  }

  if (
    message.image
  ) {

    const image =
      document.createElement(
        "img"
      );

    image.className =
      "messageImage";

    image.src =
      message.image;

    image.loading =
      "lazy";

    box.appendChild(
      image
    );

  }

  if (
    message.reference
  ) {

    const reference =
      document.createElement(
        "div"
      );

    reference.className =
      "reference";

    reference.innerHTML = `

      <img
        src="${message.reference}"
        alt=""
      >

      <span>
        参考画像を使用
      </span>

    `;

    box.appendChild(
      reference
    );

  }

  row.appendChild(
    box
  );

  chat.appendChild(
    row
  );

}


/* =========================
   LOADING
========================= */

function showLoading() {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "messageRow";

  row.id =
    "loadingRow";

  row.innerHTML = `

    <div class="message ai loading">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;

  chat.appendChild(
    row
  );

  scrollBottom();

}


function removeLoading() {

  const loading =
    document.getElementById(
      "loadingRow"
    );

  if (loading) {
    loading.remove();
  }

}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

  requestAnimationFrame(() => {

    window.scrollTo({
      top:
        document.body.scrollHeight,
      behavior:
        "smooth"
    });

  });

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const img =
            new Image();

          img.onload =
            () => {

              const maxSize =
                1600;

              let width =
                img.width;

              let height =
                img.height;

              if (
                width > maxSize ||
                height > maxSize
              ) {

                const ratio =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );

                width =
                  Math.round(
                    width * ratio
                  );

                height =
                  Math.round(
                    height * ratio
                  );

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              const data =
                canvas.toDataURL(
                  "image/jpeg",
                  .72
                );

              resolve(
                data
              );

            };

          img.onerror =
            () =>
              reject(
                new Error(
                  "画像を読み込めませんでした。"
                )
              );

          img.src =
            event.target.result;

        };

      reader.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした。"
            )
          );

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   ATTACH IMAGE
========================= */

attachButton.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files?.[0];

    if (!file) {
      return;
    }

    try {

      currentImage =
        await compressImage(
          file
        );

      attachmentPreview.src =
        currentImage;

      previewAttachment
        .classList
        .add("show");

    } catch (error) {

      alert(
        error.message
      );

    }

    fileInput.value =
      "";

  }
);


removeImage.addEventListener(
  "click",
  () => {

    currentImage =
      null;

    attachmentPreview.src =
      "";

    previewAttachment
      .classList
      .remove("show");

  }
);


/* =========================
   SEND
========================= */

async function sendMessage() {

  if (generating) {
    return;
  }

  const text =
    input.value.trim();

  if (
    !text &&
    !currentImage
  ) {

    return;

  }

  generating =
    true;

  sendButton.disabled =
    true;

  /*
   * ユーザーメッセージを
   * 一度だけ追加
   */

  const userMessage = {

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : String(
          Date.now()
        ),

    role:
      "user",

    text,

    reference:
      currentImage || null,

    createdAt:
      Date.now()

  };

  conversation.messages.push(
    userMessage
  );

  /*
   * 最初のメッセージを
   * 会話タイトルにする
   */

  if (
    conversation.title ===
    "新しい会話"
  ) {

    conversation.title =
      text
        ? text.slice(0, 32)
        : "画像編集";

  }

  saveCurrent();

  /*
   * 入力欄をすぐ消す
   */

  input.value =
    "";

  autoResize();

  const imageForRequest =
    currentImage;

  currentImage =
    null;

  attachmentPreview
    .classList
    .remove("show");

  render();

  showLoading();


  try {

    /*
     * 直近の会話だけ送る
     *
     * 生成画像そのものは送らない。
     * これでリクエストを軽くする。
     */

    const history =
      conversation.messages
        .slice(-8)
        .map(item => ({

          role:
            item.role,

          text:
            item.text || ""

        }));


    const response =
      await fetch(
        "/api/generate",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                text,

              history,

              image:
                imageForRequest

            })

        }
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "サーバーから正しい応答がありませんでした。"
      );

    }


    if (
      !response.ok
    ) {

      throw new Error(
        data?.error ||
        `サーバーエラー (${response.status})`
      );

    }


    if (
      !data?.image
    ) {

      throw new Error(
        "画像が返されませんでした。"
      );

    }


    removeLoading();


    /*
     * AIメッセージは
     * ここで初めて保存する。
     *
     * 生成中の状態を保存しないので
     * リロードによる重複を防ぐ。
     */

    conversation.messages.push({

      id:
        crypto.randomUUID
        ? crypto.randomUUID()
        : String(
            Date.now()
          ),

      role:
        "assistant",

      text:
        data.reply ||
        "できました。",

      image:
        data.image,

      createdAt:
        Date.now()

    });


    saveCurrent();

    render();

  } catch (error) {

    removeLoading();

    /*
     * エラーを会話履歴に保存しない。
     *
     * これが重要。
     * 「Load failed」が
     * 次回リロード時に
     * 何度も出る問題を防ぐ。
     */

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "messageRow";

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "message ai";

    box.innerHTML = `

      <div class="error">

        うまく処理できませんでした。

        <br><br>

        ${escapeHtml(
          error.message ||
          "不明なエラー"
        )}

        <br><br>

        <button
          id="retryButton"
          style="
            padding:10px 14px;
            border-radius:12px;
            background:#6b52ff;
            color:white;
            font-weight:700;
          "
        >
          もう一度
        </button>

      </div>

    `;

    row.appendChild(
      box
    );

    chat.appendChild(
      row
    );

    document
      .getElementById(
        "retryButton"
      )
      ?.addEventListener(
        "click",
        () => {

          input.value =
            text;

          if (
            imageForRequest
          ) {

            currentImage =
              imageForRequest;

            attachmentPreview.src =
              currentImage;

            previewAttachment
              .classList
              .add("show");

          }

          sendMessage();

        }
      );

    scrollBottom();

  } finally {

    generating =
      false;

    sendButton.disabled =
      false;

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   AUTO RESIZE
========================= */

function autoResize() {

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";

}

input.addEventListener(
  "input",
  autoResize
);


/* =========================
   SEND BUTTON
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =========================
   NEW CHAT
========================= */

newChatButton.addEventListener(
  "click",
  () => {

    if (
      conversation.messages.length &&
      !confirm(
        "新しい会話を始めますか？"
      )
    ) {

      return;

    }

    conversation =
      createConversation();

    const conversations =
      getConversations();

    conversations.unshift(
      conversation
    );

    saveConversations(
      conversations
    );

    localStorage.setItem(
      CURRENT_KEY,
      conversation.id
    );

    currentImage =
      null;

    previewAttachment
      .classList
      .remove("show");

    render();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
   HISTORY
========================= */

historyButton.addEventListener(
  "click",
  () => {

    renderHistory();

    historyPanel
      .classList
      .add("show");

  }
);


historyClose.addEventListener(
  "click",
  () => {

    historyPanel
      .classList
      .remove("show");

  }
);


historyPanel.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      historyPanel
    ) {

      historyPanel
        .classList
        .remove("show");

    }

  }
);


function renderHistory() {

  const conversations =
    getConversations()
      .sort(
        (a,b) =>
          b.updatedAt -
          a.updatedAt
      );

  historyList.innerHTML =
    "";

  if (
    !conversations.length
  ) {

    historyList.innerHTML = `

      <div
        style="
          padding:25px 10px;
          text-align:center;
          color:#777c8c;
        "
      >
        まだ会話がありません
      </div>

    `;

    return;

  }


  conversations.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "historyItem";

      const date =
        new Date(
          item.updatedAt
        );

      div.innerHTML = `

        <strong>
          ${escapeHtml(
            item.title ||
            "新しい会話"
          )}
        </strong>

        <span>
          ${date.toLocaleString(
            "ja-JP"
          )}
        </span>

      `;

      div.addEventListener(
        "click",
        () => {

          conversation =
            item;

          localStorage.setItem(
            CURRENT_KEY,
            conversation.id
          );

          historyPanel
            .classList
            .remove("show");

          currentImage =
            null;

          previewAttachment
            .classList
            .remove("show");

          render();

        }
      );

      historyList.appendChild(
        div
      );

    }
  );

}


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
