<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Iconia AI</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--panel:#12141c;--panel2:#171a24;--line:#2a2e3d;--text:#f7f8fc;--muted:#8f96aa;--accent:#7355ff;--cyan:#08c9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}button,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh}.header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#07080dea;backdrop-filter:blur(22px);border-bottom:1px solid #ffffff10}.brand{display:flex;align-items:center;gap:10px}.logo,.bigLogo{display:grid;place-items:center;background:linear-gradient(135deg,#7355ff,#08c9ff);box-shadow:0 10px 34px #4030aa55}.logo{width:46px;height:46px;border-radius:15px;font-size:24px}.brand b{font-size:19px;letter-spacing:-.3px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.headBtns{display:flex;gap:7px}.headBtn{background:#151821;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:750}.chat{max-width:920px;margin:auto;padding:8px 12px 205px}.welcome{text-align:center;padding:48px 8px 28px}.bigLogo{width:74px;height:74px;margin:auto;border-radius:23px;font-size:36px}.welcome h1{font-size:30px;line-height:1.2;margin:18px 0 9px;letter-spacing:-.7px}.welcome p{color:var(--muted);line-height:1.75;margin:0 auto;max-width:680px}.examples{display:grid;gap:10px;max-width:680px;margin:25px auto}.example{background:linear-gradient(180deg,#12151e,#10121a);border:1px solid var(--line);border-radius:17px;padding:15px 16px;text-align:left;color:#e6e8ef;line-height:1.55;transition:.15s}.example:active{transform:scale(.985);background:#171a24}.row{display:flex;margin:17px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(92%,760px);padding:13px 15px;border-radius:21px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:linear-gradient(135deg,#674cff,#5140d7);border-bottom-right-radius:7px}.bubble.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:7px;box-shadow:0 8px 30px #0002}.bubble img{display:block;width:min(620px,100%);max-width:100%;margin-top:11px;border-radius:16px;background:#05060a}.save{display:inline-flex;align-items:center;margin-top:10px;padding:9px 13px;border-radius:11px;background:#252a39;text-decoration:none;color:#fff;font-size:12px;font-weight:700}.ref{display:flex;align-items:center;gap:9px;margin-top:10px;padding:7px;background:#0003;border-radius:12px;color:#9da3b3}.ref img{width:58px;height:58px;object-fit:cover;border-radius:9px}.loading{display:flex;align-items:center;gap:9px;color:#a4aabd;padding:7px 2px}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#806cff;animation:b 1.05s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes b{0%,65%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}.error{background:#32171b!important;border-color:#682931!important;color:#ffb9b9}.error button{margin-top:10px;background:#54242a;padding:9px 13px;border-radius:11px}.composerWrap{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 72%,transparent)}.composer{max-width:920px;margin:auto;background:#151821;border:1px solid #303547;border-radius:23px;overflow:hidden;box-shadow:0 15px 55px #000a}.attachment{display:none;padding:10px 12px;border-bottom:1px solid var(--line)}.attachment.show{display:flex;align-items:center;gap:10px}.attachment img{width:60px;height:60px;object-fit:cover;border-radius:10px}.attachment div{flex:1}.attachment strong{font-size:12px}.attachment small{display:block;color:var(--muted);margin-top:3px}.remove{width:34px;height:34px;border-radius:50%;background:#252a38;font-size:20px}.input{display:flex;gap:8px;align-items:flex-end;padding:9px}.iconBtn,.send{width:47px;height:47px;border-radius:15px;background:#252a39;font-size:24px;flex:none}.send{background:linear-gradient(135deg,#7355ff,#08c9ff);font-size:21px;box-shadow:0 7px 20px #385ee755}.send:disabled{opacity:.3;box-shadow:none}.text{flex:1;min-height:47px;max-height:180px;resize:none;outline:none;border:0;background:transparent;color:var(--text);padding:12px 3px;line-height:1.55}.text::placeholder{color:#777e91}.hint{text-align:center;color:#6f7587;font-size:10px;padding:0 12px 10px}.drawer{position:fixed;inset:0;z-index:80;background:#000b;display:none}.drawer.show{display:block}.drawerBox{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);width:min(410px,calc(100% - 20px));max-height:82vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:23px;padding:15px}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{width:37px;height:37px;border-radius:50%;background:#252a39;font-size:20px}.history{display:grid;gap:8px;margin-top:12px}.historyItem{background:#1a1d27;border:1px solid var(--line);border-radius:13px;padding:11px}.historyItem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem small{display:block;color:var(--muted);margin-top:4px}@media(max-width:600px){.brand b{font-size:18px}.headBtn{padding:9px 10px;font-size:12px}.welcome{padding-top:34px}.welcome h1{font-size:25px}.bubble{max-width:94%}.hint{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">✦</div><div><b>Iconia AI</b><span>話すだけで、画像をつくる</span></div></div><div class="headBtns"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div></header>
<main class="chat" id="chat"></main>
<div class="composerWrap"><div class="composer"><div class="attachment" id="attachment"><img id="attachPreview" alt="参考画像"><div><strong>参考画像</strong><small>この画像を使って編集します</small></div><button class="remove" id="remove" aria-label="画像を削除">×</button></div><div class="input"><button class="iconBtn" id="attachBtn" title="画像を追加" aria-label="画像を追加">＋</button><textarea id="text" class="text" placeholder="作りたい画像を自由に説明してください…" rows="1"></textarea><button class="send" id="send" disabled title="送信">↑</button></div><div class="hint">Enter＝改行　／　⌘+Enter・Ctrl+Enter＝送信　／　画像あり＝編集</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="drawerBox"><div class="drawerHead"><b>会話履歴</b><button class="close" id="close">×</button></div><div class="history" id="history"></div></div></div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const KEY='iconia_v7';
let state=loadState(),pendingImage=null,sending=false,retryText='';
const $=id=>document.getElementById(id);
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{messages:[],lastImage:null}}catch{return{messages:[],lastImage:null}}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-28),lastImage:state.lastImage}))}catch{try{state.messages=state.messages.slice(-12);localStorage.setItem(KEY,JSON.stringify(state))}catch{}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isNew(t){return /^(新しく|新規|別の|もう一枚|もう1枚|違う画像|別バージョン|新しい|新たに)/.test(t.trim())}
function reuse(t){if(!state.lastImage||isNew(t))return false;return /さっき|前の|この画像|このキャラ|これ|そのまま|もう少し|もっと|背景|髪|顔|服|目|文字|テキスト|ロゴ|ポーズ|構図|明る|暗|色|大き|小さ|右|左|上|下|消して|追加|変更|修正|直して|編集|このまま|タッチ|絵柄|画風/.test(t)}
function render(){const c=$('chat');c.innerHTML='';if(!state.messages.length){c.innerHTML='<section class="welcome"><div class="bigLogo">✦</div><h1>自分だけの画像を、話すだけで。</h1><p>作りたいものを普通に話してください。参考画像を貼れば、その画像を元に編集できます。</p><div class="examples"><button class="example">💡 クールな男性キャラクターを作って。黒髪、黒い服、青い光。ゲームアイコン向け。</button><button class="example">💡 このキャラクターを使ってXのヘッダーを作って。夜の東京、青いネオン。人物は左側。</button><button class="example">💡 オリジナルのゲームアイコンを作って。高品質で、ゲームの公式イラストのように。</button></div></section>'}else{state.messages.forEach(m=>{const r=document.createElement('div');r.className='row '+m.role;const b=document.createElement('div');b.className='bubble '+m.role;b.innerHTML='<div>'+esc(m.text)+'</div>';if(m.image){const im=document.createElement('img');im.src=m.image;im.alt='生成画像';b.appendChild(im);const a=document.createElement('a');a.className='save';a.href=m.image;a.download='iconia-ai.jpg';a.textContent='画像を保存';b.appendChild(a)}if(m.ref){const q=document.createElement('div');q.className='ref';q.innerHTML='<img src="'+m.ref+'" alt=""><small>参考画像</small>';b.appendChild(q)}r.appendChild(b);c.appendChild(r)})}if(sending){const r=document.createElement('div');r.className='row ai';r.innerHTML='<div class="bubble ai"><div class="loading">最高品質で画像を作っています… <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div></div>';c.appendChild(r)}if(retryText&&!sending){const r=document.createElement('div');r.className='row ai';r.innerHTML='<div class="bubble ai error"><div>うまく処理できませんでした。</div><div>'+esc(retryText)+'</div><button id="retry">もう一度</button></div>';c.appendChild(r);setTimeout(()=>{const x=$('retry');if(x)x.onclick=()=>{const t=retryText;retryText='';sendMessage(t,true)}},0)}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function resizeText(){const t=$('text');t.style.height='auto';t.style.height=Math.min(Math.max(t.scrollHeight,47),180)+'px';$('send').disabled=!t.value.trim()||sending}
async function compressFile(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1536,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.88))};img.onerror=reject;img.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
function extractTextBlocks(message){const t=String(message||'').trim();if(!t)return[];const out=[];for(const m of t.matchAll(/[「『“"]([^」』”"]{1,100})[」』”"]/gu))if(m[1].trim())out.push(m[1].trim());const labelRe=/(?:名前|チーム名|クラン名|同盟名|ギルド名|文字|テキスト|ロゴ)\s*(?:は|を|：|:)\s*([A-Za-z0-9._\-ぁ-んァ-ヶ一-龠][^\n,，。]*)/gu;for(const m of t.matchAll(labelRe)){const v=m[1].trim().replace(/[。,.，]+$/,'');if(v&&!out.includes(v))out.push(v)}if(out.length)return out.slice(0,6);const simple=t.match(/([A-Za-z][A-Za-z0-9._-]{0,60})\s*(?:を|って)\s*(?:入れて|追加して|加えて|書いて|載せて)/i);return simple?[simple[1]]:[]}
function looksLikeTextOnly(message){const t=String(message||'');const blocks=extractTextBlocks(t);if(!blocks.length)return false;if(/AI(?:に|が)?(?:書き直|描き直|再デザイン|デザイン)|AIデザイン|全体を.*(?:再|デザイン)|雰囲気.*(?:変え|変えて)|構図.*(?:変え|変えて)|背景.*(?:変え|変更)|ポーズ.*(?:変え|変更)|タッチ.*(?:変え|変更)/u.test(t))return false;return /文字|テキスト|ロゴ|名前|チーム|クラン|同盟|ギルド|元画像|そのまま|追加|入れて|書いて|載せて|デザイン/u.test(t)}
function overlayStyle(message){const t=String(message||'');if(/金|ゴールド|gold/i.test(t))return['#FFFCE0','#FFD45A','#8A4B00'];if(/紫|パープル|purple/i.test(t))return['#FFFFFF','#D08CFF','#5B16B5'];if(/赤|レッド|red/i.test(t))return['#FFFFFF','#FF5C6D','#8E1020'];if(/青|ブルー|blue/i.test(t))return['#FFFFFF','#54D9FF','#1646FF'];if(/ピンク|pink/i.test(t))return['#FFFFFF','#FF82D2','#9D42FF'];if(/緑|グリーン|green/i.test(t))return['#FFFFFF','#67F09A','#087A4A'];if(/黒|ブラック|black/i.test(t))return['#FFFFFF','#AAB5C5','#161A22'];return['#FFFFFF','#65C7FF','#5138FF']}
function textPosition(message,index,total){const t=String(message||'');let x=.5,y=.88,align='center';if(/右下/.test(t)){x=.95;y=.88;align='right'}else if(/左下/.test(t)){x=.05;y=.88;align='left'}else if(/右上/.test(t)){x=.95;y=.14;align='right'}else if(/左上/.test(t)){x=.05;y=.14;align='left'}else if(/右側|右に|右寄り/.test(t)){x=.91;y=total>1?.5+(index-(total-1)/2)*.12:.52;align='right'}else if(/左側|左に|左寄り/.test(t)){x=.09;y=total>1?.5+(index-(total-1)/2)*.12:.52;align='left'}else if(/上|上側/.test(t)&&!/右上|左上/.test(t)){x=.5;y=.14;align='center'}else if(/中央|真ん中|センター/.test(t)){x=.5;y=.55;align='center'}else if(/下|下側/.test(t)&&!/右下|左下/.test(t)){x=.5;y=.88;align='center'}else if(total>1){x=.5;y=.74+index*.1;align='center'}return{x,y,align}}
async function applyOverlay(dataUrl,overlay){if(!overlay?.text)return dataUrl;return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const blocks=String(overlay.text).split(/\n+/).map(s=>s.trim()).filter(Boolean);const message=String(overlay.message||'');const min=Math.min(c.width,c.height);let size=Math.round(min*(/かなり大き|とても大き|超大き|巨大/.test(message)?.13:/大きく|大きめ|カッコよく|かっこよく|ゲームクラ/.test(message)?.105:.09));size=Math.max(46,Math.min(size,Math.floor(c.width/2.1)));const colors=overlayStyle(message);blocks.forEach((t,i)=>{const p=textPosition(message,i,blocks.length);const y=Math.round(c.height*p.y),x=Math.round(c.width*p.x);const g=ctx.createLinearGradient(0,y-size,0,y+size);g.addColorStop(0,colors[0]);g.addColorStop(.45,colors[1]);g.addColorStop(1,colors[2]);ctx.save();ctx.translate(x,y);if(/斜め|斜体/.test(message))ctx.rotate(-4*Math.PI/180);ctx.textAlign=p.align;ctx.textBaseline='alphabetic';ctx.font='900 '+size+'px Impact, Haettenschweiler, "Arial Black", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif';ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=size*.055;ctx.shadowOffsetY=size*.065;ctx.lineWidth=Math.max(10,size*.10);ctx.strokeStyle='#05060B';ctx.strokeText(t,0,0);ctx.shadowColor='transparent';ctx.lineWidth=Math.max(5,size*.045);ctx.strokeStyle='rgba(255,255,255,.92)';ctx.strokeText(t,0,0);ctx.fillStyle=g;ctx.fillText(t,0,0);ctx.lineWidth=Math.max(2,size*.018);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeText(t,0,0);ctx.restore()});resolve(c.toDataURL('image/jpeg',.96))}catch(e){reject(e)}};img.onerror=reject;img.src=dataUrl})}
function aiDesignRequest(t){return /AI(?:に|が)?(?:書き直|描き直|再デザイン|デザイン)|AIデザイン|全体を.*(?:再|デザイン)|雰囲気.*(?:変え|変えて)|構図.*(?:変え|変えて)/u.test(t)}
async function sendMessage(forced=null,retry=false){if(sending)return;const t=(forced??$('text').value).trim();if(!t&&!pendingImage)return;const attached=pendingImage;const image=attached||(!isNew(t)&&reuse(t)?state.lastImage:null);const aiDesign=!!image&&aiDesignRequest(t);sending=true;retryText='';if(!retry){state.messages.push({role:'user',text:t||'この画像を編集して',ref:attached||null});saveState()}$('text').value='';pendingImage=null;$('attachment').classList.remove('show');resizeText();render();try{const history=state.messages.slice(-14).map(x=>({role:x.role,text:x.text}));const res=await fetch('/api/generate.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t||'この画像を自然に編集して',image,history,aiDesign})});let data=null;try{data=await res.json()}catch{}if(!res.ok||!data?.success)throw new Error(data?.error||'サーバーから画像を受け取れませんでした。');let finalImage=data.image;if(data.overlay){const blocks=extractTextBlocks(t);const ov={...data.overlay};if(blocks.length&&looksLikeTextOnly(t))ov.text=blocks.join('\n');finalImage=await applyOverlay(data.image,ov)}state.lastImage=finalImage;state.messages.push({role:'ai',text:data.reply||'できました。気になるところがあれば、そのまま続けて指示してください。',image:finalImage});saveState()}catch(e){retryText=e?.message||'通信エラーが発生しました。'}finally{sending=false;render();resizeText()}}
$('send').onclick=()=>sendMessage();$('text').addEventListener('input',resizeText);$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendMessage();return}if(e.key==='Enter'){if(e.isComposing)return;e.preventDefault();const t=e.currentTarget,s=t.selectionStart,v=t.value;t.value=v.slice(0,s)+'\n'+v.slice(s);t.selectionStart=t.selectionEnd=s+1;resizeText()}});$('attachBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingImage=await compressFile(f);$('attachPreview').src=pendingImage;$('attachment').classList.add('show');resizeText()}catch{alert('画像を読み込めませんでした。')}e.target.value=''};$('remove').onclick=()=>{pendingImage=null;$('attachment').classList.remove('show')};$('newBtn').onclick=()=>{state={messages:[],lastImage:null};pendingImage=null;retryText='';saveState();$('text').value='';resizeText();render()};$('historyBtn').onclick=()=>{$('drawer').classList.add('show');const h=$('history');h.innerHTML=state.messages.length?'<div class="historyItem"><b>現在の会話</b><small>'+state.messages.length+'件のメッセージ</small></div>':'<small style="color:#8e94a6">まだ会話履歴はありません。</small>'};$('close').onclick=()=>$('drawer').classList.remove('show');$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')});document.addEventListener('click',e=>{if(e.target.classList.contains('example')){$('text').value=e.target.textContent.replace(/^💡\s*/,'');resizeText();$('text').focus()}});window.addEventListener('pagehide',saveState);window.addEventListener('beforeunload',saveState);resizeText();render();
</script>
</body>
</html>
