<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Iconia AI — 高精度ゲームアイコンAI</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--panel:#11141d;--panel2:#171a25;--line:#2a3040;--text:#f7f8fc;--muted:#8f97aa;--accent:#7657ff;--cyan:#09c9ff;--green:#59e1bd;--danger:#ff747d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1000px 520px at 50% -260px,#2a1c63 0,#07080d 62%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}button,textarea,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{min-height:100vh}.header{position:sticky;top:0;z-index:60;height:72px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#08090eec;backdrop-filter:blur(22px);border-bottom:1px solid #ffffff0d}.brand{display:flex;align-items:center;gap:11px}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7657ff,#09c9ff);box-shadow:0 10px 35px #4e3bca55;font-size:23px}.brand b{font-size:19px;letter-spacing:-.4px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.actions{display:flex;gap:8px}.headBtn{background:#151822;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-weight:750;font-size:12px}.layout{display:flex;max-width:1280px;margin:auto}.side{width:245px;position:fixed;top:72px;bottom:0;padding:18px 12px;background:#0a0b11;border-right:1px solid #ffffff09;display:none}.side button{width:100%;text-align:left;background:transparent;padding:12px;border-radius:12px;color:#dfe3ee}.side button:hover,.side button.active{background:#171a25}.sideTitle{color:#737b8e;font-size:10px;padding:18px 12px 9px}.main{width:100%;max-width:980px;margin:auto;padding:0 14px 250px}.welcome{text-align:center;padding:58px 10px 30px}.bigLogo{width:82px;height:82px;margin:auto;border-radius:27px;display:grid;place-items:center;background:linear-gradient(135deg,#7657ff,#09c9ff);font-size:38px;box-shadow:0 20px 70px #5141d044}.welcome h1{font-size:34px;letter-spacing:-1.2px;margin:20px 0 10px}.welcome p{color:var(--muted);max-width:720px;margin:auto;line-height:1.8}.featureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:850px;margin:25px auto 10px}.feature{padding:13px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#131620,#0f1119);text-align:left}.feature b{font-size:12px}.feature span{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.45}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:900px;margin:24px auto}.chip{padding:14px;text-align:left;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#131620,#10121a);line-height:1.5;font-size:12px}.row{display:flex;margin:20px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(94%,820px);padding:13px 15px;border-radius:22px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#694cff,#5541df);border-bottom-right-radius:7px}.ai .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:7px;box-shadow:0 10px 40px #0003}.bubble img.result{display:block;width:min(760px,100%);margin-top:12px;border-radius:17px;background:#05060a;cursor:zoom-in}.meta{color:#70788a;font-size:9px;margin-top:8px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool{background:#242938;border:1px solid #34394b;padding:8px 11px;border-radius:10px;font-size:11px}.tool:hover{background:#2b3142}.tool.primary{background:#3a2ab0;border-color:#6554e9}.ref{display:flex;align-items:center;gap:9px;margin-top:10px;padding:7px;background:#0004;border-radius:12px;color:#9da4b5}.ref img{width:58px;height:58px;object-fit:cover;border-radius:9px}.loading{display:flex;gap:9px;align-items:center;color:#aab0c1}.dots{display:flex;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#846eff;animation:p 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}.error{background:#32171b!important;border-color:#6b2931!important;color:#ffb9b9}.error .tool{background:#57262d}.presetBar,.modeBar{display:flex;gap:7px;overflow:auto;padding:7px 0 3px;scrollbar-width:none}.presetBar::-webkit-scrollbar,.modeBar::-webkit-scrollbar{display:none}.preset,.mode{white-space:nowrap;background:#171b26;border:1px solid #2c3242;padding:7px 11px;border-radius:999px;font-size:10px;color:#cdd2df}.preset.active,.mode.active{border-color:#705df0;background:#2a2257;color:white}.preset b{font-weight:800}.preset small{opacity:.7;margin-left:3px}.composerWrap{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,var(--bg) 78%,transparent)}.composer{max-width:980px;margin:auto;background:#151821;border:1px solid #303648;border-radius:24px;box-shadow:0 18px 60px #000b;overflow:hidden}.barTitle{font-size:9px;color:#747c90;padding:8px 12px 0}.attachRow{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.attachRow.show{display:flex}.attachRow img{width:62px;height:62px;object-fit:cover;border-radius:10px}.attachInfo{flex:1}.attachInfo b{font-size:12px}.attachInfo small{display:block;color:var(--muted);margin-top:3px}.remove{width:34px;height:34px;border-radius:50%;background:#282d3c;font-size:20px}.inputRow{display:flex;align-items:flex-end;gap:8px;padding:9px}.iconBtn,.send{width:48px;height:48px;border-radius:15px;background:#272c3b;flex:none;font-size:24px}.send{background:linear-gradient(135deg,#7657ff,#09c9ff);box-shadow:0 8px 25px #385ee755}.send:disabled{opacity:.3;box-shadow:none}.text{flex:1;min-height:48px;max-height:190px;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:12px 3px;line-height:1.55}.text::placeholder{color:#737b8f}.hint{text-align:center;color:#6d7487;font-size:10px;padding:0 12px 10px}.drawer,.lightbox{position:fixed;inset:0;z-index:100;background:#000c;display:none}.drawer.show,.lightbox.show{display:block}.drawerBox{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);width:min(440px,calc(100% - 20px));max-height:88vh;overflow:auto;background:#12141c;border:1px solid var(--line);border-radius:22px;padding:15px}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#282d3c;font-size:20px}.history{display:grid;gap:8px;margin-top:12px}.historyItem{background:#191c26;border:1px solid var(--line);border-radius:13px;padding:11px;cursor:pointer}.historyItem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyItem small{display:block;color:var(--muted);margin-top:4px}.status{display:flex;align-items:center;gap:6px;color:#8f98ab;font-size:10px;padding:3px 0}.status i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}.lightbox img{max-width:94vw;max-height:88vh;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px}.lightClose{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);width:44px;height:44px;border-radius:50%;background:#242837;font-size:24px}.emptyHint{color:#6d7487;text-align:center;font-size:11px;padding:15px}@media(min-width:900px){.side{display:block}.main{margin-left:245px;width:calc(100% - 245px)}.header{padding-left:calc(max(18px,(100vw - 1280px)/2 + 263px));padding-right:max(18px,(100vw - 1280px)/2)}}@media(max-width:700px){.header{height:64px;padding:7px 12px}.brand b{font-size:17px}.headBtn{padding:8px 9px}.welcome{padding-top:40px}.welcome h1{font-size:27px}.featureGrid,.chips{grid-template-columns:1fr}.feature{padding:11px}.bubble{max-width:96%}.main{padding-left:8px;padding-right:8px}.hint{font-size:9px}.presetBar,.modeBar{margin:0 -3px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">✦</div><div><b>Iconia AI</b><span>話すだけで、理想のゲームアイコンを。</span></div></div><div class="actions"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div></header>
<div class="layout"><aside class="side"><button id="sideNew" class="active">＋ 新しい会話</button><div class="sideTitle">ICONIA AI</div><button id="sideHistory">最近の会話</button><button id="clearBtn">会話をリセット</button></aside><main class="main" id="main"></main></div>
<div class="composerWrap"><div class="composer"><div class="barTitle">出力サイズ</div><div class="presetBar" id="presetBar"><button class="preset active" data-format="icon">🎮 ゲームアイコン <small>1:1</small></button><button class="preset" data-format="xheader">𝕏 X / Twitter <small>3:1</small></button><button class="preset" data-format="youtube">▶ YouTube <small>16:9</small></button><button class="preset" data-format="portrait">▯ 縦長 <small>2:3</small></button></div><div class="barTitle">編集モード</div><div class="modeBar" id="modeBar"><button class="mode active" data-mode="auto">自動・高精度</button><button class="mode" data-mode="identity">同一性を最優先</button><button class="mode" data-mode="partial">部分編集</button><button class="mode" data-mode="text">文字・ロゴ</button><button class="mode" data-mode="style">絵柄だけ変更</button><button class="mode" data-mode="background">背景だけ変更</button></div><div class="attachRow" id="attachRow"><img id="attachPreview" alt="参考画像"><div class="attachInfo"><b>参考画像</b><small id="attachLabel">この画像を元に編集します</small></div><button class="remove" id="remove">×</button></div><div class="inputRow"><button class="iconBtn" id="attachBtn" aria-label="画像を追加">＋</button><textarea id="text" class="text" rows="1" placeholder="作りたい画像を自由に説明してください…"></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint">Enter＝改行　／　⌘+Enter・Ctrl+Enter＝送信　／　画像あり＝編集</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="drawerBox"><div class="drawerHead"><b>会話履歴</b><button class="close" id="close">×</button></div><div class="history" id="history"></div></div></div>
<div class="lightbox" id="lightbox"><button class="lightClose" id="lightClose">×</button><img id="lightImg" alt="拡大画像"></div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const KEY="iconia_pro_v5";
let state=load(),pending=null,busy=false,mode="auto",format="icon";
const $=id=>document.getElementById(id);
function fresh(){return{messages:[],lastImage:null,versions:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({messages:state.messages.slice(-80),lastImage:state.lastImage,versions:(state.versions||[]).slice(-16)}))}catch{}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function isNew(t){return /^(新しく|新規|別の|もう一枚|もう1枚|違う画像|別バージョン|新しい|新たに|ゼロから|最初から)/.test(t.trim())}
function isUndo(t){return /^(戻して|元に戻して|前の状態に戻して|一つ前に戻して|ひとつ前に戻して|取り消して|直前に戻して|前に戻して|undo)$/i.test(String(t||"").trim())}
function shouldReuse(t){return !!state.lastImage&&!isNew(t)&&/(さっき|前の|この画像|このキャラ|これ|そのまま|もう少し|もっと|少し|背景|髪|顔|服|目|文字|テキスト|ロゴ|ポーズ|構図|明る|暗|色|大き|小さ|右|左|上|下|消して|追加|変更|修正|直して|編集|タッチ|絵柄|画風|同じ|部分|戻して)/.test(t)}
function uniqueImages(){const out=[];for(let i=state.messages.length-1;i>=0;i--){const im=state.messages[i]?.image;if(im&&!out.includes(im))out.push(im)}return out}
function restorePrevious(reason){const u=uniqueImages();if(u.length<2)return false;state.lastImage=u[1];state.messages.push({role:"user",text:reason,local:true});state.messages.push({role:"ai",text:"元に戻しました。直前の画像を再生成せず、そのまま復元しました。",image:u[1],local:true});save();render();scrollBottom();return true}
function welcome(){return `<section class="welcome"><div class="bigLogo">✦</div><div class="status"><i></i> 高精度編集エンジン オンライン</div><h1>自分だけのゲームアイコンを、話すだけで。</h1><p>最初はゲームアイコン用の1:1。会話の流れを理解し、人物の同一性を守りながら、必要な部分だけを編集します。</p><div class="featureGrid"><div class="feature"><b>🧠 文脈を理解</b><span>「さっきの画像」「このキャラ」などを会話から判断。</span></div><div class="feature"><b>🛡 同一性を最優先</b><span>人物・顔・髪・服・ポーズを勝手に別人へ変えない。</span></div><div class="feature"><b>✂ 部分編集</b><span>背景だけ、髪だけ、服だけ、文字だけに分けて処理。</span></div><div class="feature"><b>🔤 文字を正確に</b><span>文字だけの編集は元画像を再生成せず、高品質に合成。</span></div><div class="feature"><b>↩ 戻せる</b><span>直前の画像を再生成せず、そのまま復元。</span></div><div class="feature"><b>📐 サイズ固定</b><span>標準は1:1。Xヘッダーなどは下から選択できます。</span></div></div><div class="chips"><button class="chip">💡 クールなゲームアイコンを作って。黒髪、黒い服、青い光。最高品質で。</button><button class="chip">💡 この画像の人物はそのまま。絵柄だけプレミアムなゲームイラスト風に。</button><button class="chip">💡 このキャラのまま、背景だけ夜の東京に。人物は一切変えないで。</button></div></section>`}
function render(){const m=$("main");if(!state.messages.length){m.innerHTML=welcome();m.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('text').value=b.textContent.replace(/^💡\s*/,"");resize();$('text').focus()});return}m.innerHTML=state.messages.map((x,i)=>{let h=`<div class="row ${x.role}"><div class="bubble"><div>${x.loading?'<div class="loading">考えています… <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div>':esc(x.text)}</div>`;if(x.ref)h+=`<div class="ref"><img src="${x.ref}" alt=""><span>参考画像</span></div>`;if(x.image)h+=`<img class="result" src="${x.image}" data-i="${i}" alt="生成画像"><div class="tools"><button class="tool primary" data-act="edit" data-i="${i}">この画像を編集</button><button class="tool" data-act="save" data-i="${i}">画像を保存</button><button class="tool" data-act="text" data-i="${i}">文字を追加</button><button class="tool" data-act="style" data-i="${i}">絵柄を変更</button><button class="tool" data-act="background" data-i="${i}">背景だけ変更</button><button class="tool" data-act="undo" data-i="${i}">↩ 戻す</button></div>`;if(x.plan)h+=`<div class="meta">${esc(x.plan.formatLabel||'ゲームアイコン 1:1')} · ${esc(x.plan.mode||'AI EDIT')} · 高精度</div>`;h+=`</div></div>`;return h}).join('');m.querySelectorAll('.result').forEach(im=>im.onclick=()=>openLight(im.src));m.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>toolAction(b.dataset.act,Number(b.dataset.i)))}
function toolAction(act,i){const x=state.messages[i];if(!x?.image)return;if(act==='save'){const a=document.createElement('a');a.href=x.image;a.download=`iconia-${Date.now()}.jpg`;a.click();return}if(act==='edit'){pending=x.image;showAttach(x.image);$('text').focus();return}if(act==='text'){pending=x.image;showAttach(x.image,'文字・ロゴを追加します');$('text').value='AxLFの文字をもっと大きく、この絵に合うように入れて';resize();$('text').focus();return}if(act==='style'){pending=x.image;showAttach(x.image,'絵柄だけを変更します');$('text').value='人物・服・ポーズ・構図はそのまま、絵柄だけを変更して';resize();$('text').focus();return}if(act==='background'){pending=x.image;showAttach(x.image,'背景だけを変更します');$('text').value='人物はそのまま、背景だけを変更して';resize();$('text').focus();return}if(act==='undo'){restorePrevious('戻して')}}
function showAttach(src,label='この画像を元に編集します'){$('attachPreview').src=src;$('attachLabel').textContent=label;$('attachRow').classList.add('show')}
function openLight(src){$('lightImg').src=src;$('lightbox').classList.add('show')}
function resize(){const t=$('text');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,190)+'px';$('send').disabled=b​​usy||(!t.value.trim()&&!pending)}
function scrollBottom(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50)}
function setMode(v){mode=v;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===v))}
function setFormat(v){format=v;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x.dataset.format===v))}
function modeInstruction(){return({identity:'【同一性最優先】人物・顔・髪・服・ポーズ・構図は指示がない限り絶対に変更しない。',partial:'【部分編集】指定された部分だけを変更し、それ以外は元画像を維持する。',text:'【文字・ロゴ】文字を正確に追加・変更する。人物・背景・構図は再生成しない。',style:'【絵柄だけ】人物・服・ポーズ・構図・背景を維持し、描画タッチだけ変更する。',background:'【背景だけ】人物・服・ポーズ・既存文字を維持し、背景だけ変更する。',auto:'【自動・高精度】会話の文脈から最適な編集方法を選択する。'}[mode])}
async function submit(){if(busy)return;let text=$('text').value.trim();if(!text&&!pending)return;busy=true;resize();let ref=pending;if(!ref&&shouldReuse(text))ref=state.lastImage||null;if(isUndo(text)&&restorePrevious(text)){busy=false;$('text').value='';resize();return}state.messages.push({role:'user',text,ref:ref||null,mode,format});render();scrollBottom();state.messages.push({role:'ai',text:'',loading:true});render();scrollBottom();try{const payload={message:[modeInstruction(),text].filter(Boolean).join('\n'),image:ref||null,format,history:state.messages.filter(x=>!x.loading).slice(-28).map(x=>({role:x.role,text:x.text}))};const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();state.messages=state.messages.filter(x=>!x.loading);if(!r.ok||!data.success)throw new Error(data.error||'生成に失敗しました。');state.messages.push({role:'ai',text:data.reply||'できました。',image:data.image||null,plan:data.plan||null});if(data.image){state.lastImage=data.image;state.versions=state.versions||[];state.versions.push(data.image);state.versions=state.versions.slice(-16)}pending=null;$('attachRow').classList.remove('show');save();render();scrollBottom()}catch(e){state.messages=state.messages.filter(x=>!x.loading);state.messages.push({role:'ai',text:`うまく処理できませんでした。\n${e.message||'もう一度お試しください。'}`,error:true});save();render();scrollBottom()}finally{busy=false;$('text').value='';resize()}}
function newChat(){state=fresh();pending=null;format='icon';mode='auto';$('attachRow').classList.remove('show');$('text').value='';setFormat('icon');setMode('auto');save();render();resize();window.scrollTo({top:0,behavior:'smooth'})}
function openHistory(){const h=$('history');const items=state.messages.filter(x=>x.role==='user'&&x.text).slice(-20).reverse();h.innerHTML=items.length?items.map((x,i)=>`<div class="historyItem"><b>${esc(x.text)}</b><small>${i===0?'現在の会話':'会話内の過去の依頼'}</small></div>`).join(''):'<div class="emptyHint">まだ会話履歴がありません。</div>';$('drawer').classList.add('show')}
$('attachBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>7*1024*1024){alert('画像が大きすぎます。7MB以下にしてください。');return}const reader=new FileReader();reader.onload=()=>{pending=reader.result;showAttach(pending);resize()};reader.readAsDataURL(f);e.target.value=''};$('remove').onclick=()=>{pending=null;$('attachRow').classList.remove('show');resize()};$('text').addEventListener('input',resize);$('text').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();submit()}});$('send').onclick=submit;$('historyBtn').onclick=openHistory;$('sideHistory').onclick=openHistory;$('close').onclick=()=>$('drawer').classList.remove('show');$('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('show')};$('lightClose').onclick=()=>$('lightbox').classList.remove('show');$('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('show')};$('newBtn').onclick=newChat;$('sideNew').onclick=newChat;$('clearBtn').onclick=()=>{if(confirm('この会話をリセットしますか？'))newChat()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setFormat(b.dataset.format));render();resize();
</script>
</body>
</html>
