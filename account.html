<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iconia AI — アカウント</title><style>body{margin:0;background:#07080d;color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#12151e;border:1px solid #2b3141;border-radius:22px;padding:24px;box-sizing:border-box}.logo{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#7657ff,#0bc8ff);font-size:28px}.box h1{text-align:center;font-size:23px;margin:0 0 8px}.sub{text-align:center;color:#8e96aa;font-size:12px;line-height:1.7;margin-bottom:20px}.notice{background:#181c28;border:1px solid #2b3141;border-radius:14px;padding:12px;font-size:11px;line-height:1.6;color:#cdd2df;margin-bottom:16px}.notice b{color:#fff}.field{margin:10px 0}.field label{display:block;color:#8e96aa;font-size:11px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;background:#0c0e14;color:#fff;border:1px solid #303648;border-radius:12px;padding:12px;outline:none}.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#7657ff,#0bc8ff);color:#fff;font-weight:800}.back{display:block;text-align:center;margin-top:16px;color:#8e96aa;font-size:11px;text-decoration:none}</style></head><body><main class="box"><div class="logo">✦</div><h1>アカウントを作成</h1><div class="sub">登録は任意です。登録しなくてもIconia AIは今まで通り利用できます。</div><div class="notice">現在の利用状況を確認してから登録してください。<b>登録後は、このブラウザで利用中のクレジットを引き継ぐ設計にします。</b></div><form id="form"><div class="field"><label>メールアドレス</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>パスワード</label><input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="6文字以上"></div><button class="btn" type="submit">アカウントを作成</button></form><a class="back" href="/">← Iconia AIに戻る</a></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();alert('アカウント機能は現在準備中です。既存のクレジットを保護するため、正式な引き継ぎ処理が完成するまで登録は開始しません。');});</script></body></html>
