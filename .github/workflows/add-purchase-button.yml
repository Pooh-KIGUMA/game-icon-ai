name: Add purchase button

on:
  push:
    paths-ignore:
      - .github/workflows/add-purchase-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add purchase button to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="actions"><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div>'
          new = '<div class="actions"><a class="headBtn" href="/pricing.html" style="text-decoration:none">🪙 購入</a><button class="headBtn" id="historyBtn">履歴</button><button class="headBtn" id="newBtn">新しい会話</button></div>'
          if old in s and 'href="/pricing.html"' not in s.split('<header',1)[1].split('</header>',1)[0]:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add visible purchase link to generator"
          git push
